<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="1408 Duell">
<meta name="theme-color" content="#F1F0EC">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>1408 – Fernduell</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F1F0EC; --surface:#FFFFFF; --border:#E4E3DE;
  --grad-a:#E0326E; --grad-mid:#9E22B4; --grad-b:#4FBBDD;
  --pink:#D62E8A; --blue:#436EDC;
  --green:#00A14B; --red:#E8003D;
  --text:#16161A; --muted:#9A9AA0; --track:#CDCCC7;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; overflow:hidden; }
.screen { position:fixed; inset:0; z-index:1; display:flex; flex-direction:column; align-items:center; gap:22px;
          padding:24px; padding-top:max(env(safe-area-inset-top),40px);
          padding-bottom:calc(max(env(safe-area-inset-bottom),20px) + 16px);
          transition:opacity .3s,transform .3s; overflow-y:auto; -webkit-overflow-scrolling:touch; }
/* Der Spielbildschirm muss ohne Scrollen auskommen – deshalb enger als
   die Einstiegsbildschirme, die ruhig Luft haben dürfen. */
#gameScreen { gap:13px; padding-left:20px; padding-right:20px;
              padding-top:max(env(safe-area-inset-top),18px);
              padding-bottom:calc(max(env(safe-area-inset-bottom),12px) + 6px); }
.screen.hidden { opacity:0; pointer-events:none; transform:scale(.97); }
.logo { width:100%; display:flex; justify-content:center; flex-shrink:0; }
.logo img { width:150px; height:auto; display:block; }

/* ── Karten / Panels ──────────────────────────────────────────── */
.panel { width:100%; max-width:400px; background:var(--surface); border:1px solid var(--border);
         border-radius:20px; padding:22px; display:flex; flex-direction:column; align-items:center;
         gap:14px; flex-shrink:0; box-shadow:0 8px 28px rgba(40,30,80,.05); }
.h1 { font-size:21px; font-weight:700; letter-spacing:.3px; text-align:center; }
.sub { font-size:13px; color:var(--muted); text-align:center; line-height:1.6; }

/* ── Eingaben & Buttons ───────────────────────────────────────── */
.inp { width:100%; padding:15px 16px; border:1px solid var(--border); border-radius:14px; background:var(--bg);
       font-family:inherit; font-size:16px; font-weight:500; color:var(--text); -webkit-appearance:none; text-align:center; }
.inp:focus { outline:none; border-color:var(--grad-mid); }
.inp.code { text-transform:uppercase; letter-spacing:6px; font-weight:700; font-size:22px; }
.btn { width:100%; padding:14px; border-radius:14px; cursor:pointer; font-family:inherit; font-size:15px;
       font-weight:600; -webkit-appearance:none; text-align:center; border:1px solid var(--border);
       background:var(--surface); color:var(--text); }
.btn:disabled { opacity:.4; cursor:default; }
.btn.prim { border:none; color:white; background:linear-gradient(135deg,var(--grad-a),var(--grad-mid) 55%,var(--grad-b));
            box-shadow:0 10px 26px rgba(158,34,180,.30); }
.btn.prim:active { opacity:.9; transform:scale(.98); }
.btn.ghost { background:transparent; border:none; color:var(--muted); font-size:12px; padding:5px; }
.actions { width:100%; max-width:400px; display:flex; flex-direction:column; gap:7px; flex-shrink:0; }
.divider { display:flex; align-items:center; gap:12px; width:100%; color:var(--muted); font-size:12px; }
.divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }

/* ── Lobby-Code ───────────────────────────────────────────────── */
.bigcode { font-size:44px; font-weight:700; letter-spacing:10px; padding-left:10px;
           background:linear-gradient(135deg,var(--grad-a),var(--grad-mid) 55%,var(--grad-b));
           -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.waiting { display:flex; align-items:center; gap:9px; font-size:13px; color:var(--muted); }
.dot { width:8px; height:8px; border-radius:50%; background:var(--grad-mid); animation:blink 1.4s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:.25} 50%{opacity:1} }

/* ── Punktestand ──────────────────────────────────────────────── */
.score { width:100%; max-width:400px; display:flex; gap:10px; flex-shrink:0; }
.seat { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:14px;
        padding:8px 12px; display:flex; flex-direction:column; gap:1px; position:relative; overflow:hidden; }
.seat.active { border-color:transparent; box-shadow:0 0 0 2px var(--grad-mid); }
.seat.active::before { content:''; position:absolute; top:0; left:0; right:0; height:3px;
        background:linear-gradient(90deg,var(--grad-a),var(--grad-b)); }
.seat .nm { font-size:12px; font-weight:600; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.seat .ct { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
.seat .ct small { font-size:12px; font-weight:500; color:var(--muted); }
/* Leben im ESC-Herzstil */
.leben { display:flex; align-items:center; gap:5px; height:24px; }
.leben svg { width:21px; height:22px; display:block; fill:var(--text); flex-shrink:0;
             transition:fill .3s, opacity .3s; }
.leben svg.weg { fill:var(--track); opacity:.55; }

/* ── Bühne: Mystery / Reveal ──────────────────────────────────── */
/* Quadratisch wie die Karte – die Höhe steht damit fest, egal welche
   Phase gerade läuft. Beide Kinder liegen deckungsgleich darin. */
/* Höhe führt, Breite folgt: so bleibt die Karte quadratisch, füllt aber
   nicht mehr die halbe Seite. Der Deckel greift auf grossen Displays. */
.buehne { position:relative; aspect-ratio:1/1; height:min(33vh,270px);
          max-width:100%; margin:0 auto; flex-shrink:0; }
.stage  { position:absolute; inset:0; container-type:inline-size; }
@keyframes pop { from{opacity:0;transform:scale(.92)} to{opacity:1;transform:scale(1)} }

/* ── Kartenfront ──────────────────────────────────────────────────
   Nachbau der gedruckten Karte. Der Verlauf ist aus Set_1/Fronts
   ausgemessen: exakt linear von #ED4F4F nach #745BFF über die
   Diagonale, die Gegendiagonale bleibt konstant #B155A7.          */
.cardface { position:relative; width:100%; aspect-ratio:1/1; border-radius:22px; overflow:hidden;
            background:linear-gradient(135deg,#ED4F4F,#745BFF); color:#111114;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            gap:2px; padding:26px 22px 56px; text-align:center;
            box-shadow:0 14px 40px rgba(90,50,140,.28);
            animation:pop .4s cubic-bezier(.34,1.56,.64,1) both; }
.cardface .ca { font-size:clamp(15px,4.8vw,21px); font-weight:700; line-height:1.15;
                max-width:100%; overflow-wrap:anywhere; }
/* Ausgemessen an Set_1/Set_2: Ziffernhöhe 21,5 % der Kartenhöhe (trifft
   exakt), mittlere Breite 64,2 % (trifft mit -.045em auf 63,9 %). Die
   Streuung zwischen schmalen und breiten Jahren fällt in DM Sans größer
   aus als in der Druckschrift – das lässt sich über Laufweite nicht
   angleichen, ohne den Mittelwert zu verfehlen. */
.cardface .cy { font-size:clamp(64px,21vw,104px); font-weight:700; line-height:1;
                letter-spacing:-.045em; margin:.06em 0; }
.cardface .ct { font-size:clamp(14px,4.4vw,19px); font-weight:700; line-height:1.2;
                max-width:100%; overflow-wrap:anywhere; }
.cardface .foot { position:absolute; left:22px; right:22px; bottom:18px;
                  display:flex; align-items:center; justify-content:space-between; gap:10px; }
.cardface .land { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:400;
                  min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.cardface .land img { width:28px; height:28px; flex-shrink:0; display:block; }
.cardface .nr { font-size:14px; font-weight:400; flex-shrink:0; }

/* An der Kartenbreite ausgerichtet statt am Viewport – nur so trifft die
   Jahreszahl die 65 % Breite der gedruckten Karte. Die clamp()-Werte
   darüber bleiben als Rückfall für Browser ohne Container-Queries. */
@supports (font-size: 1cqw) {
  .cardface { padding:8cqw 7cqw 17cqw; gap:0; }
  .cardface .ca  { font-size:6.4cqw; }
  /* 29.7cqw: Ziffernhöhe von DM Sans Bold (Versalhöhe 0,724 × Schriftgrad)
     mal 29.7 % ergibt die 21,5 % Kartenhöhe der gedruckten Karte. */
  .cardface .cy  { font-size:29.7cqw; margin:.04em 0; }
  .cardface .ct  { font-size:5.8cqw; }
  .cardface .foot { left:7cqw; right:7cqw; bottom:5.5cqw; }
  .cardface .land { font-size:4.2cqw; gap:2.4cqw; }
  .cardface .land img { width:8.6cqw; height:8.6cqw; }
  .cardface .nr  { font-size:4.2cqw; }
}

/* Eigene Zeile unter der Bühne mit fester Höhe. Läge sie in der Bühne,
   ragte sie unten heraus und würde die Zeitleisten-Überschrift überdecken. */
.verdict { width:100%; max-width:400px; height:19px; flex-shrink:0;
           font-size:14px; font-weight:700; display:flex;
           align-items:center; justify-content:center; gap:8px; }
.verdict.ok  { color:var(--green); }
.verdict.err { color:var(--red); }

/* ── Player ───────────────────────────────────────────────────── */
/* Der Playbutton ist das einzige zentrierte Kind und sitzt damit genau
   dort, wo später die Mitte der aufgelösten Karte liegt. Balken und
   Statuszeile hängen darunter, ohne ihn zu verschieben. */
.player { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
/* Balken und Status hängen unter dem Button, ohne ihn aus der Kartenmitte
   zu schieben. Breiter als die Karte, damit die Zeitanzeige Platz hat. */
.punten { position:absolute; left:50%; transform:translateX(-50%); width:min(100vw - 40px,400px);
          top:calc(50% + 50px); display:flex; flex-direction:column; align-items:center; gap:10px; }
/* flex-shrink:0 ist eine Sicherung: in einem zu schmalen Container würde
   der Button sonst zu einer Ellipse zusammengedrückt statt sichtbar
   überzulaufen – ein Layoutfehler wäre dann schwer zu erkennen. */
.pbtn { width:74px; height:74px; flex-shrink:0; border-radius:50%; border:none; cursor:pointer; display:flex; align-items:center;
        justify-content:center; -webkit-appearance:none; transition:transform .15s;
        background:linear-gradient(135deg,var(--grad-a),var(--grad-mid) 55%,var(--grad-b));
        box-shadow:0 12px 34px rgba(158,34,180,.35); }
.pbtn:active { transform:scale(.96); }
.pbtn:disabled { background:var(--track); box-shadow:none; cursor:default; }
.pbtn.on { animation:pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 12px 34px rgba(158,34,180,.35)}
                   50%{box-shadow:0 12px 44px rgba(158,34,180,.6),0 0 0 14px rgba(158,34,180,.06)} }
.pbtn svg { width:29px; height:29px; fill:white; margin-left:3px; }
.pbtn.on svg { margin-left:0; }
.iplay{display:block;} .ipause{display:none;}
.pbtn.on .iplay{display:none;} .pbtn.on .ipause{display:block;}
.pw { width:100%; display:flex; align-items:center; gap:14px; }
.pbar { flex:1; height:5px; background:var(--track); border-radius:3px; overflow:hidden; }
.pfill { height:100%; width:0%; background:linear-gradient(90deg,var(--blue),var(--pink)); border-radius:3px; }
.tlbl { font-size:13px; color:var(--muted); min-width:40px; text-align:right; font-variant-numeric:tabular-nums; }
.stat { font-size:13px; color:var(--muted); text-align:center; min-height:18px; }
.stat.ok{color:var(--green);} .stat.err{color:var(--red);}

/* ── Zeitleiste ───────────────────────────────────────────────── */
.tlwrap { width:100%; max-width:400px; flex-shrink:0; }
.tllabel { font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
           color:var(--muted); margin-bottom:5px; padding-left:2px; }
.tl { display:flex; align-items:stretch; gap:0; overflow-x:auto; padding:3px 2px 8px;
      -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.tl::-webkit-scrollbar { display:none; }
/* Miniaturen derselben Kartenfront */
.tlcard { flex:0 0 auto; width:82px; aspect-ratio:1/1; border-radius:12px; overflow:hidden;
          background:linear-gradient(135deg,#ED4F4F,#745BFF); color:#111114;
          padding:8px 7px; display:flex; flex-direction:column; align-items:center;
          justify-content:center; gap:2px; text-align:center;
          box-shadow:0 5px 14px rgba(90,50,140,.22); }
.tlcard .y { font-size:22px; font-weight:700; line-height:1; letter-spacing:-.02em; }
.tlcard .t { font-size:8px; font-weight:600; line-height:1.25; opacity:.78;
             display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.tlcard .f { font-size:13px; line-height:0; margin-bottom:2px; }
.tlcard .f img { width:20px; height:20px; display:block; }
.tlcard.fresh { animation:pop .45s cubic-bezier(.34,1.56,.64,1) both;
                box-shadow:0 0 0 3px var(--green), 0 5px 14px rgba(90,50,140,.22); }
.gap { flex:0 0 auto; width:30px; display:flex; align-items:center; justify-content:center;
       background:none; border:none; padding:0; font-family:inherit; }
.gap .bar { width:4px; height:46px; border-radius:3px; background:var(--track); transition:all .2s; }
.gap.live .bar { background:linear-gradient(180deg,var(--grad-a),var(--grad-b)); cursor:pointer; }
.gap.live:active .bar { transform:scaleX(2); }
.gap.sel .bar { width:15px; height:60px; background:linear-gradient(180deg,var(--grad-a),var(--grad-b));
                box-shadow:0 6px 18px rgba(158,34,180,.40); }
.tlempty { font-size:13px; color:var(--muted); padding:14px 0; }

/* ── Gegner-Leiste (kompakt) ──────────────────────────────────── */
.oppo { width:100%; max-width:400px; flex-shrink:0; }
/* Auf dem Handy existiert dieser Container nicht als Box: seine Kinder
   liegen direkt in der Spalte, genau wie vor der Desktop-Ansicht. */
.rechts { display:contents; }
.oppo .tllabel { margin-bottom:4px; }
.oppo .row { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
.oppo .row::-webkit-scrollbar { display:none; }
.chip { flex:0 0 auto; font-size:11px; font-weight:600; padding:5px 9px; border-radius:50px;
        background:var(--surface); border:1px solid var(--border); color:var(--muted); }

.cf { position:fixed; inset:0; pointer-events:none; z-index:999; overflow:hidden; }
.err-banner { width:100%; max-width:400px; background:#FDECEF; border:1px solid #F5C2CE; color:var(--red);
              border-radius:14px; padding:12px 14px; font-size:13px; line-height:1.5; flex-shrink:0; }

/* ══ Desktop ══════════════════════════════════════════════════════
   Ausgelöst über die Fensterbreite, nicht über Geräteerkennung: die
   User-Agent-Auswertung veraltet ständig und trifft weder ein schmal
   gezogenes Desktop-Fenster noch ein iPad in beiden Ausrichtungen
   richtig. Wer das Fenster verkleinert, bekommt die Handy-Ansicht.  */
@media (min-width:900px) {

  /* Einstiegsbildschirme mittig statt oben klebend */
  #homeScreen, #lobbyScreen, #overScreen { justify-content:center; }
  .logo img { width:180px; }

  /* Links die Karte, rechts Punktestand, Zeitleiste und Aktionen. Die
     DOM-Reihenfolge bleibt unangetastet, die Zuordnung macht das Raster.
     Die Spaltenbreiten begrenzen sich selbst, damit es auf sehr breiten
     Bildschirmen nicht auseinanderläuft. */
  #gameScreen {
    /* Feste Spaltenbreite statt auto: beim Ziehen und Anspielen ist die
       Bühne leer (Player und Balken sind absolut positioniert), eine
       auto-Spalte fiele dann auf null zusammen und der Player rutschte
       aus dem Bild. */
    --kartengroesse:min(46vh,340px);
    display:grid; align-content:center; justify-content:center;
    column-gap:34px; row-gap:14px;
    grid-template-columns:var(--kartengroesse) minmax(360px,880px);
    /* Alle Zeilen inhaltsgroß – eine 1fr-Zeile würde die Resthöhe
       schlucken und die Verdict-Zeile an den Fensterboden schieben. */
    grid-template-rows:auto auto auto;
    grid-template-areas:
      "buehne  score"
      "buehne  rechts"
      "verdict rechts";
    padding:32px 40px;
  }
  /* Nicht auf volle Spaltenbreite ziehen – für „Karten 15“ und drei Herzen
     wären 427 px pro Kachel absurd. */
  #gameScreen > .score   { grid-area:score;  align-self:start; max-width:480px; }
  #gameScreen > .buehne  { grid-area:buehne; align-self:start;
                           width:var(--kartengroesse); height:var(--kartengroesse); }
  #gameScreen > .verdict { grid-area:verdict; max-width:none; }
  #gameScreen > .rechts  { grid-area:rechts; display:flex; flex-direction:column;
                           justify-content:flex-start; gap:18px; min-width:0; }
  /* Auf dem Handy darf der Balken breiter als die Karte sein, hier nicht. */
  #gameScreen .punten    { width:var(--kartengroesse); }

  /* Die Breite kommt der Zeitleiste zugute: statt drei Karten wie auf dem
     Handy sind hier sieben bis acht gleichzeitig sichtbar. Die Größe der
     Miniaturen bleibt, damit die Titel lesbar sind. */
  #gameScreen .tlwrap, #gameScreen .oppo, #gameScreen .actions { max-width:none; }

  /* Aktionen nebeneinander – der Abbruch muss am Rechner nicht so breit
     sein wie der Hauptknopf. */
  #gameScreen .actions { flex-direction:row; gap:14px; align-items:stretch; }
  /* width:auto ist nötig: mit den geerbten width:100% würde der Hauptknopf
     die ganze Zeile beanspruchen und den Abbruch hinausschieben. */
  #gameScreen .actions .btn { width:auto; }
  #gameScreen .actions .btn.prim { flex:1; min-width:0; }
  #gameScreen .actions .btn.ghost { white-space:nowrap; padding:5px 18px; }

  /* Maus statt Finger: hier darf auf Hover reagiert werden. */
  .gap.live:hover .bar { background:linear-gradient(180deg,var(--grad-a),var(--grad-b));
                         transform:scaleX(1.8); }
  .btn { transition:transform .12s, box-shadow .12s, border-color .12s, color .12s; }
  .btn.prim:not(:disabled):hover { transform:translateY(-1px);
                                   box-shadow:0 12px 30px rgba(158,34,180,.38); }
  .btn:not(.prim):not(.ghost):not(:disabled):hover { border-color:var(--grad-mid); }
  .btn.ghost:hover { color:var(--text); }
  .pbtn:not(:disabled):hover { transform:scale(1.04); }
}
</style>
</head>
<body>

<!-- ══ START ══════════════════════════════════════════════════ -->
<div class="screen" id="homeScreen">
  <div class="logo"><img src="Logo.png" width="513" height="222" alt="Eurovision Song Contest 1408"></div>
  <div class="panel">
    <div class="h1">Fernduell</div>
    <div class="sub">Zwei Spieler, zwei Handys.<br>Die App ist die Verbindung.</div>
    <input class="inp" id="nameInput" placeholder="Dein Name" maxlength="14" autocomplete="off">
  </div>
  <div class="actions">
    <button class="btn prim" id="btnCreate">Neues Spiel starten</button>
    <div class="divider">oder</div>
    <input class="inp code" id="codeInput" placeholder="CODE" maxlength="5" autocomplete="off"
           autocapitalize="characters" autocorrect="off" spellcheck="false">
    <button class="btn" id="btnJoin">Spiel beitreten</button>
    <div class="divider">alleine</div>
    <button class="btn" id="btnSolo">Solo spielen</button>
    <div class="sub" id="soloBest"></div>
  </div>
  <div class="stat" id="homeStat"></div>
</div>

<!-- ══ LOBBY ══════════════════════════════════════════════════ -->
<div class="screen hidden" id="lobbyScreen">
  <div class="logo"><img src="Logo.png" width="513" height="222" alt="Eurovision Song Contest 1408"></div>
  <div class="panel">
    <div class="sub">Spielcode</div>
    <div class="bigcode" id="lobbyCode">—</div>
    <div class="sub" id="lobbyHint">Gib den Code an deinen Mitspieler weiter</div>
  </div>
  <div class="panel" id="lobbySeats"></div>
  <div class="actions">
    <button class="btn prim" id="btnStart" disabled>Spiel starten</button>
    <button class="btn ghost" id="btnLeaveLobby">Abbrechen</button>
  </div>
</div>

<!-- ══ SPIEL ══════════════════════════════════════════════════ -->
<div class="screen hidden" id="gameScreen">
  <div class="score" id="score"></div>
  <!-- Feste Höhe im Format der Karte. Player und Auflösung liegen darin
       übereinander, damit beim Phasenwechsel nichts verrutscht. -->
  <div class="buehne">
    <div class="stage" id="stage"></div>
    <div class="player" id="playerBox">
      <button class="pbtn" id="pbtn" disabled>
        <svg class="iplay"  viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="ipause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <div class="punten">
        <div class="pw">
          <div class="pbar"><div class="pfill" id="pfill"></div></div>
          <div class="tlbl" id="tlbl">—</div>
        </div>
        <div class="stat" id="stat">—</div>
      </div>
    </div>
  </div>
  <div class="verdict" id="verdict"></div>
  <!-- Auf dem Handy löst sich dieser Container per display:contents auf,
       die Kinder liegen dann direkt in der Spalte wie vorher. Am Desktop
       wird er zur rechten Spalte. -->
  <div class="rechts">
    <div class="tlwrap">
      <div class="tllabel" id="tlLabel">Zeitleiste</div>
      <div class="tl" id="tl"></div>
    </div>
    <div class="oppo" id="oppo"></div>
    <div class="actions" id="gameActions"></div>
  </div>
</div>

<div class="cf" id="cf"></div>
<audio id="aud" preload="auto" playsinline></audio>

<script src="duell-config.js"></script>
<script type="module">
// Feste Version statt @2: ein automatisches Minor-Update soll das Spiel
// nicht mitten in einer Runde kaputtmachen.
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.111.0';

// ══ Konstanten ═══════════════════════════════════════════════════
const ZIEL = window.DUELL_ZIEL || 10;
const CODE_ALPHABET = 'ACDEFGHJKLMNPQRTUVWXY34679';   // ohne verwechselbare Zeichen
const STORE_KEY = 'duell1408';
const SOLO_KEY  = 'duell1408solo';      // laufende Solo-Partie
const BEST_KEY  = 'duell1408best';      // Bestwert im Solo-Modus
const SOLO_FEHLER = 3;                  // nach dem dritten Fehler ist Schluss
// Vorlauf beim Autostart: beide Geräte bekommen Zeit, die Preview zu laden,
// damit der Song bei beiden wirklich bei Sekunde 0 beginnt statt mittendrin.
const VORLAUF_MS = 900;
// Wer beim Start einer Karte weniger als so viele Sekunden hinterherhinkt,
// hört sie trotzdem von vorn statt mittendrin einzusteigen. Die Spieler
// sitzen nicht im selben Raum – ein Versatz von ein, zwei Sekunden ist
// unhörbar, ein fehlender Songanfang wäre sofort spürbar.
const ANLAUF_KULANZ = 3;
const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';

// ══ Zustand (lokal) ══════════════════════════════════════════════
const aud = document.getElementById('aud');
let sb = null;                 // Supabase-Client
let SONGS = null;              // songs.json
let G = null;                  // { code, version, state }
let seat = null;               // 'p1' | 'p2' – wer bin ich?
let channel = null;
let pollTimer = null, tickTimer = null;
let clockOffset = 0;           // Serverzeit − lokale Zeit, in ms
let pendingGap = null;         // vorgemerkte Lücke, wartet auf Bestätigung
let audioUnlocked = false;
let lastRenderedCard = null;   // um Audio nur bei Kartenwechsel neu zu laden
let confettiShownFor = null;
let soloRekord = false;        // war die letzte Solo-Partie ein Bestwert?
let vorlaufTimer = null;       // wartet den Autostart-Vorlauf ab
let audioAnweisung = null;     // welche Audio-Anweisung ist schon umgesetzt?

const $  = id => document.getElementById(id);
const other = s => s === 'p1' ? 'p2' : 'p1';
const show = id => document.querySelectorAll('.screen')
  .forEach(s => s.classList.toggle('hidden', s.id !== id));
const setStat = (m,c) => { const e=$('stat'); e.textContent=m; e.className='stat'+(c?' '+c:''); };
const setHomeStat = (m,c) => { const e=$('homeStat'); e.textContent=m; e.className='stat'+(c?' '+c:''); };
const song = id => SONGS ? SONGS[id] : null;
const yearOf = id => parseInt(song(id).year, 10);
const serverNow = () => Date.now() + clockOffset;
const solo = () => !!(G && G.state.solo);

// ══ Start ════════════════════════════════════════════════════════
init();

async function init() {
  $('btnCreate').addEventListener('click', createGame);
  $('btnJoin').addEventListener('click', joinGame);
  $('btnSolo').addEventListener('click', startSolo);
  $('btnLeaveLobby').addEventListener('click', leaveGame);
  $('btnHome').addEventListener('click', leaveGame);
  $('btnStart').addEventListener('click', startGame);
  $('btnAgain').addEventListener('click', playAgain);
  $('pbtn').addEventListener('click', togglePlay);
  $('codeInput').addEventListener('input', e => {
    e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);
  });
  // Beim ersten Antippen das Audio-Element für spätere programmatische
  // Wiedergabe freischalten (iOS/Android erlauben play() sonst nur direkt
  // aus einer Nutzergeste heraus – der wartende Spieler tippt aber nicht).
  document.addEventListener('pointerdown', unlockAudio, { once:true });

  aud.addEventListener('ended', onAudioEnded);

  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (saved?.name) $('nameInput').value = saved.name;
  zeigeBestwert();

  // Songs zuerst: die braucht auch der Solo-Modus, und der soll selbst
  // dann laufen, wenn Supabase klemmt.
  await loadSongs();

  try {
    if (!window.SUPABASE_URL || window.SUPABASE_URL.includes('DEIN-PROJEKT'))
      throw new Error('Supabase ist noch nicht konfiguriert – trag URL und Key in duell-config.js ein.');
    sb = createClient(window.SUPABASE_URL, window.SUPABASE_KEY, {
      realtime: { params: { eventsPerSecond: 10 } }
    });
  } catch (e) { return fail(e.message + ' Solo spielen geht trotzdem.'); }

  await calibrateClock();

  // Laufendes Spiel? Dann direkt wieder rein – erst das Duell, sonst Solo.
  if (saved?.code && saved?.seat) {
    const { data } = await sb.from('games').select().eq('code', saved.code).maybeSingle();
    if (data && data.state.phase !== 'over') {
      seat = saved.seat; adopt(data); await subscribe(saved.code);
      return;
    }
  }
  const soloSt = JSON.parse(localStorage.getItem(SOLO_KEY) || 'null');
  if (soloSt && soloSt.phase !== 'over') { seat = 'p1'; G = { code:null, version:0, state:soloSt }; render(); }
}

function fail(msg) {
  const b = document.createElement('div');
  b.className = 'err-banner';
  b.textContent = '⚠️ ' + msg;
  $('homeScreen').insertBefore(b, $('homeScreen').children[1]);
  $('btnCreate').disabled = $('btnJoin').disabled = true;
}

function loadSongs() {
  return fetch('songs.json?v=' + Date.now())
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => { SONGS = d; })
    .catch(() => fail('Songdaten konnten nicht geladen werden – Internetverbindung prüfen.'));
}

// Die beiden Handys gehen unterschiedlich. Für die Audio-Synchronisation
// messen wir einmal den Versatz zur Serveruhr (dreimal, bester RTT gewinnt).
async function calibrateClock() {
  let best = Infinity;
  for (let i = 0; i < 3; i++) {
    const t0 = Date.now();
    const { data, error } = await sb.rpc('server_now');
    if (error) return;
    const rtt = Date.now() - t0;
    if (rtt < best) {
      best = rtt;
      clockOffset = new Date(data).getTime() + rtt / 2 - Date.now();
    }
  }
}

function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  const src = aud.src;
  aud.src = SILENT;
  aud.play().then(() => { aud.pause(); if (src) aud.src = src; }).catch(() => {});
}

// ══ Spiel anlegen / beitreten ════════════════════════════════════
function myName() {
  return ($('nameInput').value || '').trim().slice(0,14) || 'Spieler';
}

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function newCode() {
  let c = '';
  for (let i = 0; i < 5; i++) c += CODE_ALPHABET[Math.floor(Math.random()*CODE_ALPHABET.length)];
  return c;
}

async function createGame() {
  if (!SONGS) return setHomeStat('Songdaten laden noch…','');
  setHomeStat('Spiel wird angelegt…','');
  const state = {
    phase: 'lobby',
    ziel: ZIEL,
    seats: { p1: { name: myName() }, p2: null },
    turn: 'p1',
    deck: shuffled(Object.keys(SONGS)),
    timelines: { p1: [], p2: [] },
    current: null,
    audio: { playing:false, startedAt:0, seek:0 },
    result: null,
    winner: null
  };
  for (let tries = 0; tries < 6; tries++) {
    const code = newCode();
    const { data, error } = await sb.from('games')
      .insert({ code, state, version: 0 }).select().maybeSingle();
    if (data) {
      seat = 'p1';
      adopt(data);
      await subscribe(code);
      return;
    }
    if (error && error.code !== '23505') return setHomeStat('Fehler: ' + error.message, 'err');
  }
  setHomeStat('Konnte keinen freien Code finden – nochmal versuchen.','err');
}

// ── Solo ─────────────────────────────────────────────────────────
// Läuft ohne Supabase: G wird lokal gehalten, commit() schreibt nicht
// ins Netz. Endlos ziehen, nach SOLO_FEHLER Fehlern ist Schluss.
function startSolo() {
  if (!SONGS) return setHomeStat('Songdaten laden noch…','');
  const deck = shuffled(Object.keys(SONGS));
  seat = 'p1';
  G = { code:null, version:0, state:{
    solo: true,
    phase: 'draw',
    ziel: Infinity,
    maxFehler: SOLO_FEHLER,
    fehler: 0,
    seats: { p1: { name: myName() }, p2: null },
    turn: 'p1',
    timelines: { p1: [deck.pop()], p2: [] },
    deck,
    current: null,
    audio: { playing:false, startedAt:0, seek:0 },
    result: null,
    winner: null
  }};
  localStorage.setItem(STORE_KEY, JSON.stringify({ name: myName() }));
  // Gleich sichern, sonst ginge die Partie bei einem Reload vor der ersten
  // Karte verloren – gespeichert wird sonst erst beim ersten commit().
  try { localStorage.setItem(SOLO_KEY, JSON.stringify(G.state)); } catch(e) {}
  render();
}

function bestwert() { return parseInt(localStorage.getItem(BEST_KEY) || '0', 10); }

function zeigeBestwert() {
  const b = bestwert();
  $('soloBest').textContent = b ? `Dein Bestwert: ${b} Karten` : '';
}

async function joinGame() {
  const code = ($('codeInput').value || '').trim().toUpperCase();
  if (code.length !== 5) return setHomeStat('Bitte den 5-stelligen Code eingeben.','err');
  setHomeStat('Suche Spiel…','');
  const { data, error } = await sb.from('games').select().eq('code', code).maybeSingle();
  if (error) return setHomeStat('Fehler: ' + error.message, 'err');
  if (!data)  return setHomeStat('Kein Spiel mit dem Code ' + code + '.','err');

  // Platz schon belegt? Dann bin ich vielleicht der zurückkehrende Spieler.
  if (data.state.seats.p2) {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (saved?.code === code && saved?.seat) {
      seat = saved.seat; adopt(data); return subscribe(code);
    }
    return setHomeStat('Das Spiel ist schon voll.','err');
  }

  seat = 'p2';
  adopt(data);
  await subscribe(code);
  await commit(s => { s.seats.p2 = { name: myName() }; return s; });
}

async function leaveGame() {
  localStorage.setItem(STORE_KEY, JSON.stringify({ name: myName() }));   // Name behalten
  localStorage.removeItem(SOLO_KEY);
  if (channel) { await sb.removeChannel(channel); channel = null; }
  clearInterval(pollTimer);
  stopAudio();
  G = null; seat = null; lastRenderedCard = null; confettiShownFor = null;
  pendingGap = null; soloRekord = false;
  setHomeStat('','');
  zeigeBestwert();
  show('homeScreen');
}

// ══ Realtime ═════════════════════════════════════════════════════
async function subscribe(code) {
  if (channel) await sb.removeChannel(channel);
  channel = sb.channel('game:' + code)
    .on('postgres_changes',
        { event:'UPDATE', schema:'public', table:'games', filter:'code=eq.'+code },
        p => adopt(p.new))
    .subscribe();

  // Fallback: Realtime kann bei Netzwechsel (WLAN → mobil) still abreißen.
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (!G) return;
    const { data } = await sb.from('games').select().eq('code', G.code).maybeSingle();
    if (data && data.version > G.version) adopt(data);
  }, 4000);
}

function adopt(row) {
  G = { code: row.code, version: row.version, state: row.state };
  localStorage.setItem(STORE_KEY, JSON.stringify({ code: row.code, seat, name: myName() }));
  render();
}

// Schreiben mit optimistischem Sperren: nur wenn die Version noch stimmt.
// Bei Konflikt neu laden und den Mutator erneut anwenden.
async function commit(mutate) {
  // Solo: kein Netz, kein Sperren – einfach lokal anwenden und sichern.
  if (solo()) {
    const next = mutate(structuredClone(G.state));
    if (!next) return false;
    G = { code:null, version:G.version + 1, state:next };
    try { localStorage.setItem(SOLO_KEY, JSON.stringify(next)); } catch(e) {}
    render();
    return true;
  }
  for (let i = 0; i < 5; i++) {
    const next = mutate(structuredClone(G.state));
    if (!next) return false;
    const { data } = await sb.from('games')
      .update({ state: next, version: G.version + 1 })
      .eq('code', G.code).eq('version', G.version)
      .select().maybeSingle();
    if (data) { adopt(data); return true; }
    const fresh = await sb.from('games').select().eq('code', G.code).maybeSingle();
    if (!fresh.data) return false;
    adopt(fresh.data);
  }
  return false;
}

// ══ Spielablauf ══════════════════════════════════════════════════
async function startGame() {
  await commit(s => {
    if (!s.seats.p2) return null;
    // Jeder startet mit einer aufgedeckten Karte.
    s.timelines.p1 = [ s.deck.pop() ];
    s.timelines.p2 = [ s.deck.pop() ];
    s.turn = Math.random() < .5 ? 'p1' : 'p2';
    s.phase = 'draw';
    return s;
  });
}

async function drawCard() {
  await commit(s => {
    if (s.phase !== 'draw' || s.turn !== seat) return null;
    s.current = s.deck.pop();
    // Läuft von selbst los. Der Vorlauf liegt in der Zukunft, damit beide
    // Geräte die Preview geladen haben, bevor Sekunde 0 fällt.
    s.audio = { playing:true, startedAt:serverNow() + VORLAUF_MS, seek:0 };
    s.result = null;
    s.phase = 'turn';
    return s;
  });
}

// Richtig einsortiert, wenn die Karte zwischen ihre beiden Nachbarn passt.
// Gleiche Jahre zählen als passend – bei 336 Songs auf 71 Jahrgänge ist
// das der Normalfall, nicht die Ausnahme.
function isCorrect(timeline, index, cardId) {
  const y = yearOf(cardId);
  const before = index > 0 ? yearOf(timeline[index-1]) : -Infinity;
  const after  = index < timeline.length ? yearOf(timeline[index]) : Infinity;
  return before <= y && y <= after;
}

async function place(index) {
  await commit(s => {
    if (s.phase !== 'turn' || s.turn !== seat || !s.current) return null;
    const tl  = s.timelines[seat];
    const id  = s.current;
    const ok  = isCorrect(tl, index, id);
    if (ok) tl.splice(index, 0, id);
    s.result = { seat, id, index, correct: ok };
    s.audio  = { playing:false, startedAt:0, seek:0 };
    s.phase  = 'result';
    if (s.solo) {
      if (!ok) s.fehler++;
      // Der Bestwert muss hier fallen, nicht nach dem commit: im Solo-Modus
      // zeichnet commit() sofort neu, und renderOver liest soloRekord.
      if (s.fehler >= s.maxFehler) { s.phase = 'over'; merkeBestwert(tl.length); }
    } else if (ok && tl.length >= s.ziel) {
      s.phase = 'over'; s.winner = seat;
    }
    return s;
  });
}

// Bestwert ist die Länge der Zeitleiste, wenn der dritte Fehler fällt.
// Erst vergleichen, dann speichern – sonst wäre der alte Wert schon weg.
function merkeBestwert(n) {
  soloRekord = n > bestwert();
  if (soloRekord) localStorage.setItem(BEST_KEY, String(n));
}

// Nach der Auflösung in einem Schritt: Zug abgeben und gleich die nächste
// Karte aufdecken. Vorher waren das zwei Tipps ("Weiter", dann "Karte
// ziehen"), was sich doppelt anfühlte.
async function naechsteKarte() {
  await commit(s => {
    if (s.phase !== 'result') return null;
    if (!s.solo) s.turn = other(s.turn);
    s.result = null;
    if (!s.deck.length) {
      s.phase = 'over';
      s.current = null;
      if (!s.solo && !s.winner) {
        const a = s.timelines.p1.length, b = s.timelines.p2.length;
        s.winner = a === b ? null : (a > b ? 'p1' : 'p2');
      }
      return s;
    }
    s.current = s.deck.pop();
    s.audio = { playing:true, startedAt:serverNow() + VORLAUF_MS, seek:0 };
    s.phase = 'turn';
    return s;
  });
}

async function playAgain() {
  if (solo()) return startSolo();
  await commit(s => {
    s.deck      = shuffled(Object.keys(SONGS));
    s.timelines = { p1: [s.deck.pop()], p2: [s.deck.pop()] };
    s.turn      = Math.random() < .5 ? 'p1' : 'p2';
    s.current   = null;
    s.result    = null;
    s.winner    = null;
    s.audio     = { playing:false, startedAt:0, seek:0 };
    s.phase     = 'draw';
    return s;
  });
}

// ══ Audio ════════════════════════════════════════════════════════
// Der Spieler am Zug steuert, beide hören. Statt den Ton zu streamen
// synchronisieren wir nur den Startzeitpunkt: beide laden dieselbe
// iTunes-Preview und springen an dieselbe Stelle.
async function togglePlay() {
  if (!G || G.state.turn !== seat) return;
  const playing = G.state.audio.playing;
  const pos = aud.currentTime || 0;
  await commit(s => {
    s.audio = playing
      ? { playing:false, startedAt:0, seek:pos }
      : { playing:true,  startedAt:serverNow(), seek:(aud.duration && pos >= aud.duration - .3 ? 0 : pos) };
    return s;
  });
}

function targetTime(a) {
  return a.playing ? a.seek + (serverNow() - a.startedAt) / 1000 : a.seek;
}

function syncAudio(st) {
  const s = song(st.current);
  if (!s) return stopAudio();
  if (lastRenderedCard !== st.current) {
    lastRenderedCard = st.current;
    aud.src = s.pr;
    aud.load();
    $('pfill').style.width = '0%';
    $('tlbl').textContent = '—';
  }
  // Die Previews sind unterschiedlich lang – im Katalog überwiegend 90 s,
  // vereinzelt 30 s. Vor den Metadaten kennen wir die Länge nicht, also
  // erst dann springen und starten.
  if (!aud.duration) {
    // Komplett neu zeichnen statt nur nachsynchronisieren, damit auch der
    // Statustext aus dem "Lädt…" herauskommt.
    aud.addEventListener('loadedmetadata', () => { if (G) render(); }, { once:true });
    return 'laedt';
  }
  const want = targetTime(st.audio);

  // Vorlauf läuft noch: beide Geräte warten auf Position 0, damit der Song
  // wirklich bei beiden von vorn beginnt und nicht mittendrin einsteigt.
  if (st.audio.playing && want < 0) {
    if (!aud.paused) aud.pause();
    if (aud.currentTime) aud.currentTime = 0;
    clearTimeout(vorlaufTimer);
    vorlaufTimer = setTimeout(() => { if (G) render(); }, Math.min(2000, -want * 1000) + 60);
    return 'vorlauf';
  }

  // Der wartende Spieler schreibt nie in den Zustand. Läuft die Preview
  // aus, während er zusieht, bleibt dort also "playing: true" stehen. Wer
  // danach neu lädt oder das Handy entsperrt, würde sonst eine tote
  // Anzeige sehen – deshalb hier auf "durchgelaufen" erkennen.
  if (st.audio.playing && want >= aud.duration) {
    if (!aud.paused) aud.pause();
    $('pfill').style.width = '100%';
    $('tlbl').textContent = '0:00';
    return 'fertig';
  }

  // Jede Audio-Anweisung genau einmal umsetzen statt laufend auf die
  // Sollposition nachzuregeln. Das Nachregeln würde einen Start von vorn
  // sofort wieder wegkorrigieren – und nötig ist es nicht, weil Audio-Uhren
  // über 90 Sekunden nicht nennenswert auseinanderlaufen.
  const anweisung = `${st.current}|${st.audio.playing}|${st.audio.startedAt}|${st.audio.seek}`;
  if (anweisung !== audioAnweisung) {
    audioAnweisung = anweisung;
    if (st.audio.playing) {
      // Kartenstart: lieber von vorn als mittendrin (siehe ANLAUF_KULANZ).
      aud.currentTime = (!st.audio.seek && want < ANLAUF_KULANZ) ? 0 : Math.max(0, want);
      aud.play()
        .then(() => { if (G) render(); })         // Status von "Lädt…" auf "läuft"
        .catch(() => {
          audioAnweisung = null;                  // beim nächsten Zeichnen erneut versuchen
          setStat('Tippe einmal auf den Bildschirm, um Ton zu erlauben','err');
        });
    } else {
      aud.pause();
      aud.currentTime = Math.max(0, want);
    }
  }
  if (!st.audio.playing) return 'pause';
  return aud.paused ? 'laedt' : 'laeuft';
}

function fmtTime(sec) {
  const r = Math.max(0, Math.ceil(sec));
  return Math.floor(r/60) + ':' + String(r%60).padStart(2,'0');
}

// Sobald die Länge bekannt ist, im Ruhezustand die Gesamtdauer anzeigen.
aud.addEventListener('loadedmetadata', () => {
  if (aud.paused && aud.duration) $('tlbl').textContent = fmtTime(aud.duration);
});

// Beide Geräte kennen die Deck-Reihenfolge, also lässt sich die nächste
// Preview schon laden, während noch aufgelöst wird. Der Browser hat sie
// dann im Cache und der Autostart trifft Sekunde 0 – gerade beim wartenden
// Spieler, der den Zustand erst über Realtime bekommt. Kostet keine
// zusätzlichen Daten, die Datei würde ohnehin gleich gebraucht.
let vorladeEl = null, vorgeladen = null;
function ladeNaechsteVor(st) {
  const naechste = st.deck[st.deck.length - 1];
  if (!naechste || vorgeladen === naechste) return;
  const s = song(naechste);
  if (!s) return;
  vorgeladen = naechste;
  if (!vorladeEl) { vorladeEl = new Audio(); vorladeEl.preload = 'auto'; }
  vorladeEl.src = s.pr;
  vorladeEl.load();
}

function stopAudio() {
  if (lastRenderedCard === null) return;     // schon gestoppt
  aud.pause(); aud.removeAttribute('src'); aud.load();
  lastRenderedCard = null;
  audioAnweisung = null;
}

function onAudioEnded() {
  $('pfill').style.width = '100%';
  $('tlbl').textContent = '0:00';
  if (G && G.state.turn === seat && G.state.audio.playing)
    commit(s => { s.audio = { playing:false, startedAt:0, seek:0 }; return s; });
}

// Fortschrittsbalken lokal, ohne Netzwerk
tickTimer = setInterval(() => {
  if (!aud.duration || aud.paused) return;
  $('pfill').style.width = (aud.currentTime / aud.duration * 100) + '%';
  $('tlbl').textContent = fmtTime(aud.duration - aud.currentTime);
}, 250);

// ══ Rendering ════════════════════════════════════════════════════
function render() {
  if (!G || !SONGS) return;
  const st = G.state;
  if (st.phase === 'lobby')      return renderLobby(st);
  if (st.phase === 'over')       return renderOver(st);
  renderGame(st);
}

function renderLobby(st) {
  show('lobbyScreen');
  $('lobbyCode').textContent = G.code;
  $('lobbyHint').textContent = seat === 'p1'
    ? 'Gib den Code an deinen Mitspieler weiter'
    : 'Warte, bis dein Mitspieler startet';
  const seats = $('lobbySeats');
  seats.innerHTML = '';
  ['p1','p2'].forEach(k => {
    const d = document.createElement('div');
    d.style.cssText = 'display:flex;align-items:center;gap:10px;width:100%;font-size:14px;font-weight:600';
    if (st.seats[k]) {
      d.innerHTML = `<span style="color:var(--green)">●</span> ${esc(st.seats[k].name)}` +
                    (k === seat ? ' <span style="color:var(--muted);font-weight:500">(du)</span>' : '');
    } else {
      d.innerHTML = `<span class="dot"></span> <span style="color:var(--muted);font-weight:500">warte auf Mitspieler…</span>`;
    }
    seats.appendChild(d);
  });
  const ready = !!st.seats.p2;
  $('btnStart').disabled = !(ready && seat === 'p1');
  $('btnStart').textContent = seat === 'p1'
    ? (ready ? 'Spiel starten' : 'Warte auf Mitspieler')
    : (ready ? 'Warte auf Start…' : 'Warte auf Mitspieler');
}

function renderGame(st) {
  show('gameScreen');
  const mine = st.turn === seat;

  // ── Punktestand ──
  if (st.solo) {
    const herz = weg => `<svg class="${weg ? 'weg' : ''}" viewBox="0 0 95.2 100"><use href="#escherz"/></svg>`;
    const leben = Array.from({ length: st.maxFehler }, (_, i) => herz(i >= st.maxFehler - st.fehler)).join('');
    $('score').innerHTML = `
      <div class="seat active"><div class="nm">Karten</div>
        <div class="ct">${st.timelines.p1.length}</div></div>
      <div class="seat"><div class="nm">Leben</div>
        <div class="ct leben">${leben}</div></div>`;
  } else {
    $('score').innerHTML = ['p1','p2'].map(k => `
      <div class="seat${st.turn===k?' active':''}">
        <div class="nm">${esc(st.seats[k]?.name || '—')}${k===seat?' (du)':''}</div>
        <div class="ct">${st.timelines[k].length}<small> / ${st.ziel}</small></div>
      </div>`).join('');
  }

  // ── Bühne ──
  // Vor der Auflösung bleibt sie leer: der Player allein sagt genug.
  const stage = $('stage');
  const auflösung = st.phase === 'result';
  stage.innerHTML = auflösung ? revealHTML(st.result.id) : '';
  stage.style.display = auflösung ? 'block' : 'none';

  const vd = $('verdict');
  vd.textContent = !auflösung ? ''
    : st.result.correct ? '✓ Richtig einsortiert' : '✕ Daneben – Karte kommt zurück';
  vd.className = 'verdict' + (auflösung ? (st.result.correct ? ' ok' : ' err') : '');

  // ── Player ──
  // Bleibt auch beim Ziehen stehen (nur ausgegraut), damit der Knopf nicht
  // erst auftaucht und alles darunter verschiebt.
  const audible = st.phase === 'turn';
  $('playerBox').style.display = auflösung ? 'none' : 'flex';
  $('pbtn').disabled = !(audible && mine);
  if (audible) {
    const lauf = syncAudio(st);
    $('pbtn').classList.toggle('on', lauf === 'laeuft');
    setStat(
      lauf === 'laeuft' ? (st.solo ? '♫ Läuft' : '♫ Ihr hört beide zu')
      : lauf === 'vorlauf' ? 'Gleich geht’s los…'
      : lauf === 'laedt' ? 'Lädt…'
      : lauf === 'fertig' ? (mine ? 'Durchgelaufen – nochmal ▶ oder einsortieren' : 'Durchgelaufen')
      : mine ? 'Tippe ▶ zum Anspielen'
      : 'Wartet auf ' + st.seats[st.turn].name,
      lauf === 'laeuft' ? 'ok' : '');
  } else {
    $('pbtn').classList.remove('on');
    clearTimeout(vorlaufTimer);
    stopAudio();
    $('pfill').style.width = '0%';
    $('tlbl').textContent = '—';
    setStat(st.phase === 'draw' && !mine ? 'Wartet auf ' + st.seats[st.turn].name : '', '');
    ladeNaechsteVor(st);        // Ziehen und Auflösen sind die ruhigen Momente
  }

  // ── Zeitleiste des Spielers am Zug ──
  const tlSeat = st.phase === 'result' ? st.result.seat : st.turn;
  $('tlLabel').textContent = tlSeat === seat ? 'Deine Zeitleiste' : 'Zeitleiste von ' + st.seats[tlSeat].name;
  renderTimeline(st, tlSeat, mine && st.phase === 'turn');

  // ── Gegner kompakt (im Solo gibt es keinen) ──
  if (st.solo) {
    $('oppo').innerHTML = '';
  } else {
    const oSeat = other(tlSeat);
    $('oppo').innerHTML = `<div class="tllabel">${oSeat===seat ? 'Deine Karten' : esc(st.seats[oSeat].name)}</div>
      <div class="row">${st.timelines[oSeat].map(id => `<span class="chip">${song(id).year}</span>`).join('') ||
        '<span class="chip">noch leer</span>'}</div>`;
  }

  // ── Aktionen ──
  renderActions(st, mine);

  if (st.phase === 'result' && st.result.correct && confettiShownFor !== st.result.id + st.result.index) {
    confettiShownFor = st.result.id + st.result.index;
    if (st.result.seat === seat) confetti();
  }
}

function renderTimeline(st, tlSeat, interactive) {
  const tl = st.timelines[tlSeat];
  const el = $('tl');
  el.innerHTML = '';
  const freshIdx = (st.phase === 'result' && st.result.correct && st.result.seat === tlSeat) ? st.result.index : -1;
  let focus = null;   // was der Spieler nach dem Neuzeichnen sehen muss

  for (let i = 0; i <= tl.length; i++) {
    const gap = document.createElement('button');
    const sel = interactive && pendingGap === i;
    gap.className = 'gap' + (interactive ? ' live' : '') + (sel ? ' sel' : '');
    gap.innerHTML = '<span class="bar"></span>';
    if (interactive) {
      gap.addEventListener('click', () => {
        pendingGap = (pendingGap === i) ? null : i;
        render();
      });
    }
    el.appendChild(gap);
    if (sel) focus = gap;

    if (i < tl.length) {
      const s = song(tl[i]);
      const c = document.createElement('div');
      c.className = 'tlcard' + (i === freshIdx ? ' fresh' : '');
      c.style.background = verlauf(tl[i]);
      c.innerHTML = `<div class="f">${flagImg(s)}</div><div class="y">${s.year}</div><div class="t">${esc(s.title)}</div>`;
      el.appendChild(c);
      if (i === freshIdx) focus = c;
    }
  }
  if (!tl.length && !interactive) el.innerHTML = '<div class="tlempty">Noch keine Karten</div>';

  // Ab ~4 Karten passt die Leiste nicht mehr auf den Schirm. Die gewählte
  // Lücke bzw. die gerade einsortierte Karte muss aber sichtbar sein.
  if (focus) requestAnimationFrame(() =>
    focus.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' }));
}

function renderActions(st, mine) {
  const a = $('gameActions');
  a.innerHTML = '';
  const add = (label, cls, fn, disabled) => {
    const b = document.createElement('button');
    b.className = 'btn ' + cls;
    b.textContent = label;
    b.disabled = !!disabled;
    if (fn) b.addEventListener('click', fn);
    a.appendChild(b);
  };

  if (st.phase === 'draw') {
    mine ? add('Karte ziehen', 'prim', drawCard)
         : add('Warte auf ' + st.seats[st.turn].name + '…', '', null, true);
  } else if (st.phase === 'turn') {
    if (!mine) add(st.seats[st.turn].name + ' sortiert ein…', '', null, true);
    else if (pendingGap === null) add('Tippe eine Lücke in der Zeitleiste', '', null, true);
    else add('Hier einsortieren', 'prim', () => { const g = pendingGap; pendingGap = null; place(g); });
  } else if (st.phase === 'result') {
    add('Nächste Karte', 'prim', naechsteKarte);
  }
  add(st.solo ? 'Solo beenden' : 'Spiel verlassen', 'ghost', leaveGame);
}

// ── Kartenverläufe ───────────────────────────────────────────────
// Aus allen 336 gedruckten Karten ausgemessen: 25 Farbpaare, jeweils
// exakt linear über die Diagonale, teils in beide Richtungen.
const VERLAEUFE = [
  ['#FFF6AD','#FFA9F8'], ['#FFF199','#FF3131'], ['#99F074','#5DE6FE'],
  ['#FF49C6','#FFEA64'], ['#8B52FE','#5CE0E6'], ['#DDFE96','#51C84F'],
  ['#FFC1F4','#FF5D5D'], ['#CCFED8','#94B9FE'], ['#FFDF09','#FFFAC2'],
  ['#DBFEFE','#CBAFE7'], ['#0CC0DE','#FEDD59'], ['#5DE5FE','#FEC2F5'],
  ['#FFDE09','#FECFB4'], ['#0097B1','#7DD857'], ['#745BFE','#F85BF6'],
  ['#94B8FE','#F6A3F6'], ['#FE5757','#8C52FE'], ['#FE66B9','#59B4FF'],
  ['#5977FE','#FE71BE'], ['#FEBF31','#56EAE1'], ['#AE89F9','#00BE63'],
  ['#FF5757','#FFD852'], ['#ED4F4F','#745BFE'], ['#8B50FE','#A9FEA3'],
  ['#4D6CDB','#C1EFFE']
];

// Der Verlauf muss aus der Song-ID folgen, nicht aus Zufall: dieselbe
// Karte soll in der Zeitleiste, in der Auflösung und auf beiden Handys
// gleich aussehen. FNV-1a streut die 336 IDs gut über die 25 Paare.
function verlauf(id) {
  let h = 2166136261;
  const s = String(id);
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  h >>>= 0;
  const [a, b] = VERLAEUFE[h % VERLAEUFE.length];
  return (h >>> 9) & 1
    ? `linear-gradient(135deg,${b},${a})`
    : `linear-gradient(135deg,${a},${b})`;
}

// Dateiname der Herzflagge aus dem Ländernamen. Muss identisch zu slug()
// in build_flags.py bleiben.
function flagSlug(land) {
  return String(land).toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}

// Für Ungarn gibt es (noch) keine Herzflagge – dann übernimmt das Emoji.
// Der Ersatz muss ein Element sein, sonst greift das flex-gap daneben nicht.
function flagImg(s) {
  return `<img src="flags/${flagSlug(s.country)}.png" alt="" data-fb="${s.flag}"
               onerror="this.outerHTML='&lt;span&gt;'+this.dataset.fb+'&lt;/span&gt;'">`;
}

function revealHTML(id) {
  const s = song(id);
  return `<div class="cardface" style="background:${verlauf(id)}">
    <div class="ca">${esc(s.artist)}</div>
    <div class="cy">${s.year}</div>
    <div class="ct">${esc(s.title)}</div>
    <div class="foot">
      <span class="land">${flagImg(s)}${esc(s.country)}</span>
      <span class="nr">${s.place && s.place !== '—' ? 'Platz ' + esc(s.place) : 'ESC'}</span>
    </div>
  </div>`;
}

function renderOver(st) {
  show('overScreen');
  stopAudio();
  localStorage.removeItem(SOLO_KEY);

  if (st.solo) {
    const n = st.timelines.p1.length;
    $('overTitle').textContent = soloRekord ? 'Neuer Bestwert!' : `${n} Karten`;
    $('overSub').textContent = soloRekord
      ? `${n} Karten in deiner Zeitleiste – so weit warst du noch nie.`
      : `${n} Karten geschafft. Dein Bestwert liegt bei ${bestwert()}.`;
    $('btnAgain').textContent = 'Nochmal solo';
    zeigeBestwert();
    if (soloRekord) confetti();
    return;
  }

  const w = st.winner;
  $('btnAgain').textContent = 'Nochmal spielen';
  $('overTitle').textContent = !w ? 'Unentschieden'
    : (w === seat ? 'Du gewinnst!' : st.seats[w].name + ' gewinnt');
  $('overSub').textContent =
    `${st.seats.p1.name} ${st.timelines.p1.length} : ${st.timelines.p2.length} ${st.seats.p2.name}`;
  if (w === seat) confetti();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

// ── Konfetti (aus index.html übernommen) ─────────────────────────
function confetti() {
  const cols = ['#E0326E','#9E22B4','#4FBBDD','#D62E8A','#436EDC'];
  const c = $('cf');
  for (let i = 0; i < 36; i++) {
    const el = document.createElement('div');
    const sz=5+Math.random()*9, tx=(Math.random()-.5)*300, ty=-(80+Math.random()*220),
          rot=Math.random()*720, dl=Math.random()*.3;
    el.style.cssText = `position:absolute;width:${sz}px;height:${sz}px;background:${cols[i%5]};` +
      `border-radius:${Math.random()>.5?'50%':'2px'};left:${35+Math.random()*30}%;top:55%;` +
      `animation:cf${i} ${.8+Math.random()*.4}s ${dl}s ease-out forwards`;
    const st = document.createElement('style');
    st.textContent = `@keyframes cf${i}{to{transform:translate(${tx}px,${ty}px) rotate(${rot}deg);opacity:0}}`;
    document.head.appendChild(st); c.appendChild(el);
    setTimeout(() => { el.remove(); st.remove(); }, 1400);
  }
}
</script>
