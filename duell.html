<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Project 1408">
<meta name="theme-color" content="#F1F0EC">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>1408 Online Spiel</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F1F0EC; --surface:#FFFFFF; --border:#E4E3DE;
  --grad-a:#E0326E; --grad-mid:#9E22B4; --grad-b:#4FBBDD;
  --pink:#D62E8A; --blue:#436EDC;
  --green:#00A14B; --red:#E8003D;
  --text:#16161A; --muted:#9A9AA0; --track:#CDCCC7;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; overflow:hidden; }
/* height:100dvh statt inset:0 – auf dem iPhone misst inset:0 die grosse
   Viewport-Hoehe, waehrend Safaris untere Leiste einen Teil verdeckt. Der
   letzte Knopf verschwand dadurch halb dahinter. */
.screen { position:fixed; top:0; left:0; right:0; height:100dvh;
          z-index:1; display:flex; flex-direction:column; align-items:center; gap:22px;
          padding:24px; padding-top:max(env(safe-area-inset-top),40px);
          padding-bottom:calc(max(env(safe-area-inset-bottom),20px) + 16px);
          transition:opacity .3s,transform .3s; overflow-y:auto; -webkit-overflow-scrolling:touch; }
/* Der Spielbildschirm muss ohne Scrollen auskommen – deshalb enger als
   die Einstiegsbildschirme, die ruhig Luft haben dürfen. */
#gameScreen { gap:13px; padding-left:20px; padding-right:20px;
              padding-top:calc(max(env(safe-area-inset-top),10px) + 26px);
              padding-bottom:calc(max(env(safe-area-inset-bottom),12px) + 6px); }
.screen.hidden { opacity:0; pointer-events:none; transform:scale(.97); }
.logo { width:100%; display:flex; justify-content:center; flex-shrink:0; }
.logo img { width:150px; height:auto; display:block; }

/* ── Karten / Panels ──────────────────────────────────────────── */
.panel { width:100%; max-width:400px; background:var(--surface); border:1px solid var(--border);
         border-radius:20px; padding:22px; display:flex; flex-direction:column; align-items:center;
         gap:14px; flex-shrink:0; box-shadow:0 8px 28px rgba(40,30,80,.05); }
.h1 { font-size:21px; font-weight:700; letter-spacing:.3px; text-align:center; }
.sub { font-size:13px; color:var(--muted); text-align:center; line-height:1.6; }

/* ── Eingaben & Buttons ───────────────────────────────────────── */
.inp { width:100%; padding:15px 16px; border:1px solid var(--border); border-radius:14px; background:var(--bg);
       font-family:inherit; font-size:16px; font-weight:500; color:var(--text); -webkit-appearance:none; text-align:center; }
.inp:focus { outline:none; border-color:var(--grad-mid); }
.inp.code { text-transform:uppercase; letter-spacing:6px; font-weight:700; font-size:22px; }
.btn { width:100%; padding:14px; border-radius:14px; cursor:pointer; font-family:inherit; font-size:15px;
       font-weight:600; -webkit-appearance:none; text-align:center; border:1px solid var(--border);
       background:var(--surface); color:var(--text); }
.btn:disabled { opacity:.4; cursor:default; }
.btn.prim { border:none; color:white; background:linear-gradient(135deg,var(--grad-a),var(--grad-mid) 55%,var(--grad-b));
            box-shadow:0 10px 26px rgba(158,34,180,.30); }
.btn.prim:active { opacity:.9; transform:scale(.98); }
.btn.ghost { background:transparent; border:none; color:var(--muted); font-size:12px; padding:5px; }
.actions { width:100%; max-width:400px; display:flex; flex-direction:column; gap:7px; flex-shrink:0; }
.divider { display:flex; align-items:center; gap:12px; width:100%; color:var(--muted); font-size:12px; }
.divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }

/* ── Lobby-Code ───────────────────────────────────────────────── */
.bigcode { font-size:44px; font-weight:700; letter-spacing:10px; padding-left:10px;
           background:linear-gradient(135deg,var(--grad-a),var(--grad-mid) 55%,var(--grad-b));
           -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.waiting { display:flex; align-items:center; gap:9px; font-size:13px; color:var(--muted); }
.dot { width:8px; height:8px; border-radius:50%; background:var(--grad-mid); animation:blink 1.4s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:.25} 50%{opacity:1} }

/* ── Punktestand ──────────────────────────────────────────────── */
.score { width:100%; max-width:400px; display:flex; gap:10px; flex-shrink:0; }
.seat { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:14px;
        padding:8px 12px; display:flex; flex-direction:column; gap:1px; position:relative; overflow:hidden; }
.seat.active { border-color:transparent; box-shadow:0 0 0 2px var(--grad-mid); }
.seat.active::before { content:''; position:absolute; top:0; left:0; right:0; height:3px;
        background:linear-gradient(90deg,var(--grad-a),var(--grad-b)); }
.seat .nm { font-size:12px; font-weight:600; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.seat .ct { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
.seat .ct small { font-size:12px; font-weight:500; color:var(--muted); }
/* Leben im ESC-Herzstil */
.leben { display:flex; align-items:center; gap:5px; height:24px; }
.leben svg { width:21px; height:22px; display:block; fill:var(--text); flex-shrink:0;
             transition:fill .3s, opacity .3s; }
.leben svg.weg { fill:var(--track); opacity:.55; }

/* ── Bühne: Mystery / Reveal ──────────────────────────────────── */
/* Quadratisch wie die Karte – die Höhe steht damit fest, egal welche
   Phase gerade läuft. Beide Kinder liegen deckungsgleich darin. */
/* Höhe führt, Breite folgt: so bleibt die Karte quadratisch, füllt aber
   nicht mehr die halbe Seite. Der Deckel greift auf grossen Displays. */
.buehne { position:relative; aspect-ratio:1/1; height:min(33vh,270px);
          max-width:100%; margin:0 auto; flex-shrink:0; }
.stage  { position:absolute; inset:0; container-type:inline-size; }
@keyframes pop { from{opacity:0;transform:scale(.92)} to{opacity:1;transform:scale(1)} }

/* ── Kartenfront ──────────────────────────────────────────────────
   Nachbau der gedruckten Karte. Der Verlauf ist aus Set_1/Fronts
   ausgemessen: exakt linear von #ED4F4F nach #745BFF über die
   Diagonale, die Gegendiagonale bleibt konstant #B155A7.          */
.cardface { position:relative; width:100%; aspect-ratio:1/1; border-radius:22px; overflow:hidden;
            background:linear-gradient(135deg,#ED4F4F,#745BFF); color:#111114;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            gap:2px; padding:26px 22px 56px; text-align:center;
            box-shadow:0 14px 40px rgba(90,50,140,.28);
            animation:pop .4s cubic-bezier(.34,1.56,.64,1) both; }
.cardface .ca { font-size:clamp(15px,4.8vw,21px); font-weight:700; line-height:1.15;
                max-width:100%; overflow-wrap:anywhere; }
/* Ausgemessen an Set_1/Set_2: Ziffernhöhe 21,5 % der Kartenhöhe (trifft
   exakt), mittlere Breite 64,2 % (trifft mit -.045em auf 63,9 %). Die
   Streuung zwischen schmalen und breiten Jahren fällt in DM Sans größer
   aus als in der Druckschrift – das lässt sich über Laufweite nicht
   angleichen, ohne den Mittelwert zu verfehlen. */
.cardface .cy { font-size:clamp(64px,21vw,104px); font-weight:700; line-height:1;
                letter-spacing:-.045em; margin:.06em 0; }
.cardface .ct { font-size:clamp(14px,4.4vw,19px); font-weight:700; line-height:1.2;
                max-width:100%; overflow-wrap:anywhere; }
.cardface .foot { position:absolute; left:22px; right:22px; bottom:18px;
                  display:flex; align-items:center; justify-content:space-between; gap:10px; }
.cardface .land { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:400;
                  min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.cardface .land img { width:28px; height:28px; flex-shrink:0; display:block; }
.cardface .nr { font-size:14px; font-weight:400; flex-shrink:0; }

/* An der Kartenbreite ausgerichtet statt am Viewport – nur so trifft die
   Jahreszahl die 65 % Breite der gedruckten Karte. Die clamp()-Werte
   darüber bleiben als Rückfall für Browser ohne Container-Queries. */
@supports (font-size: 1cqw) {
  .cardface { padding:8cqw 7cqw 17cqw; gap:0; }
  .cardface .ca  { font-size:6.4cqw; }
  /* 29.7cqw: Ziffernhöhe von DM Sans Bold (Versalhöhe 0,724 × Schriftgrad)
     mal 29.7 % ergibt die 21,5 % Kartenhöhe der gedruckten Karte. */
  .cardface .cy  { font-size:29.7cqw; margin:.04em 0; }
  .cardface .ct  { font-size:5.8cqw; }
  .cardface .foot { left:7cqw; right:7cqw; bottom:5.5cqw; }
  .cardface .land { font-size:4.2cqw; gap:2.4cqw; }
  .cardface .land img { width:8.6cqw; height:8.6cqw; }
  .cardface .nr  { font-size:4.2cqw; }
}

/* Eigene Zeile unter der Bühne mit fester Höhe. Läge sie in der Bühne,
   ragte sie unten heraus und würde die Zeitleisten-Überschrift überdecken. */
.verdict { width:100%; max-width:400px; height:19px; flex-shrink:0;
           font-size:14px; font-weight:700; display:flex;
           align-items:center; justify-content:center; gap:8px; }
/* Die Auflösung bleibt schwarz, egal wie sie ausgeht. Ob die Karte sitzt,
   sagt schon der Text – und in der Zeitleiste die frisch einsortierte Karte. */

/* ── Player ───────────────────────────────────────────────────── */
/* Der Playbutton ist das einzige zentrierte Kind und sitzt damit genau
   dort, wo später die Mitte der aufgelösten Karte liegt. Balken und
   Statuszeile hängen darunter, ohne ihn zu verschieben. */
.player { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
/* Restzeit und Status stehen unter der Karte, nicht darauf – so bleiben die
   Ringe ungestört und der Text steht wieder auf hellem Grund, also schwarz.
   Der Platz dafür ist die Zeile der Auflösung: die ist leer, solange der
   Player zu sehen ist, und der Player verschwindet, sobald sie gefüllt wird. */
.punten { position:absolute; left:50%; top:calc(100% + 4px); transform:translateX(-50%);
          width:min(100vw - 40px,400px); display:flex; flex-direction:column;
          align-items:center; gap:0; pointer-events:none; }

/* ── Player: die Kartenrückseite ───────────────────────────────────
   Gleiche Form und Größe wie die aufgedeckte Karte – beim Auflösen wird die
   Karte umgedreht, nicht ausgetauscht. Auf der gedruckten Rückseite sitzt
   der QR-Code auf schwarzem Grund, umringt von dünnen Ringen im Verlauf;
   hier steht der Playbutton an seiner Stelle.
   Ausgemessen am Druckmotiv (480 px): Ringe bei r=136…198, Abstand 8,8 px,
   Strich 4,3 px – im 200er-Viewport also r=56,9…82,5 bei Strich 1,8. Der
   Ringkranz endet hier etwas früher, damit unten Platz für die Restzeit
   bleibt. */
.player { position:absolute; inset:0; border-radius:22px; background:#0d0a12;
          /* kein overflow:hidden – der Textblock hängt jetzt unterhalb der
             Karte und würde sonst abgeschnitten. Die Ringe bleiben ohnehin
             innerhalb, der äußerste endet bei r=91,5 von 100. */
          display:flex; align-items:center; justify-content:center;
          box-shadow:0 14px 40px rgba(90,50,140,.28); }
/* pointer-events:none ist zwingend: das SVG liegt als positioniertes Element
   über dem Knopf und fing sonst jeden Klick ab – der Ton ließ sich dann
   weder anhalten noch neu starten. */
.ringe { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.ringe circle { fill:none; }
.ringe .deko circle { stroke:url(#ringGrad); stroke-width:3; }
/* Der Rahmen des Knopfes ist der Fortschritt. Ungefüllt bleibt er schwarz
   wie der Grund – deshalb gibt es bewusst keine Spur darunter. */
.ringe .pfill { stroke:url(#ringGrad); stroke-width:3.4; stroke-linecap:round;
                transition:stroke-dashoffset .25s linear; }
/* Farben der gedruckten Rückseite, am Ring abgetastet: oben links Cyan,
   unten rechts Pink. stop-color muss aus dem CSS kommen. */
#ringGrad stop.r1 { stop-color:#30B7FE; }
#ringGrad stop.r2 { stop-color:#9B4FFA; }
#ringGrad stop.r3 { stop-color:#FC2786; }

/* Schwarz wie die Karte: sichtbar ist nur das Zeichen und der Rahmen, der
   sich füllt. Größe in Prozent der Karte, damit der Ring an r=40 im
   Viewport genau die Knopfkante trifft. */
.pbtn { width:40%; height:40%; border-radius:50%; border:none; cursor:pointer;
        display:flex; align-items:center; justify-content:center;
        background:#0d0a12; -webkit-appearance:none; transition:transform .15s; }
.pbtn:active { transform:scale(.94); }
.pbtn:disabled { opacity:.4; cursor:default; }
.pbtn svg { width:42%; height:42%; fill:#fff; margin-left:6%; }
.pbtn.on svg { margin-left:0; }
.iplay{display:block;} .ipause{display:none;}
.pbtn.on .iplay{display:none;} .pbtn.on .ipause{display:block;}
.tlbl { font-size:13px; line-height:1.15; color:var(--muted); text-align:center; font-variant-numeric:tabular-nums; }
.stat { font-size:13px; line-height:1.25; color:var(--muted); text-align:center; min-height:16px; }
.stat.err{color:var(--red);}
/* Die Statuszeile steht auf der schwarzen Kartenrückseite, also hell. Kein
   Grün/Rot mehr; auf dem Startbildschirm behält #homeStat sein Rot, dort ist
   es die einzige Rückmeldung, die man bekommt. */
/* Die Statuszeile im Spiel schreibt durchgehend schwarz. Auf dem
   Startbildschirm behält #homeStat dagegen sein Rot für Fehlermeldungen –
   dort ist es die einzige Rückmeldung, die man bekommt. */
#stat { color:var(--text); }

/* ── Zeitleiste ───────────────────────────────────────────────── */
.tlwrap { width:100%; max-width:400px; flex-shrink:0; }
.tllabel { font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
           color:var(--muted); margin-bottom:5px; padding-left:2px; }
/* Der untere Innenabstand liegt zwischen den Karten und dem Rollbalken –
   knapp darunter wirkt der Balken wie angeklebt, zumal der Kartenschatten
   noch nach unten ausläuft. */
.tl { display:flex; align-items:stretch; gap:0; overflow-x:auto; padding:3px 2px 11px;
      -webkit-overflow-scrolling:touch; }
/* Sichtbarer Rollbalken statt gar keinem: ab etwa vier Karten geht die Leiste
   seitlich weiter, und am Rechner ist das sonst nicht zu erkennen – macOS
   blendet Rollbalken nur während des Scrollens ein.
   Hier NICHT scrollbar-width/scrollbar-color setzen: sobald eine der beiden
   Eigenschaften gesetzt ist, ignoriert Chrome die ::-webkit-scrollbar-Regeln
   und zeichnet wieder einen überlagernden Balken, der im Ruhezustand
   unsichtbar bleibt – gemessen: offsetHeight−clientHeight fällt dann auf 0.
   Mit den Pseudoelementen allein sind es 6 px, der Balken belegt also Platz
   und steht dauerhaft. Ohne Überlauf zeichnet ihn overflow-x:auto gar nicht. */
.tl::-webkit-scrollbar { height:6px; }
.tl::-webkit-scrollbar-track { background:transparent; }
.tl::-webkit-scrollbar-thumb { background:var(--track); border-radius:3px; }
.tl:hover::-webkit-scrollbar-thumb { background:var(--muted); }
/* Firefox kennt die Pseudoelemente nicht und braucht den anderen Weg. */
@supports not selector(::-webkit-scrollbar) {
  .tl { scrollbar-width:thin; scrollbar-color:var(--track) transparent; }
}
/* Miniaturen derselben Kartenfront */
.tlcard { flex:0 0 auto; width:82px; aspect-ratio:1/1; border-radius:12px; overflow:hidden;
          background:linear-gradient(135deg,#ED4F4F,#745BFF); color:#111114;
          padding:8px 7px; display:flex; flex-direction:column; align-items:center;
          justify-content:center; gap:2px; text-align:center;
          box-shadow:0 5px 14px rgba(90,50,140,.22); }
.tlcard .y { font-size:22px; font-weight:700; line-height:1; letter-spacing:-.02em; }
.tlcard .t { font-size:8px; font-weight:600; line-height:1.25; opacity:.78;
             display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.tlcard .f { font-size:13px; line-height:0; margin-bottom:2px; }
.tlcard .f img { width:20px; height:20px; display:block; }
.tlcard.fresh { animation:pop .45s cubic-bezier(.34,1.56,.64,1) both;
                box-shadow:0 0 0 3px var(--green), 0 5px 14px rgba(90,50,140,.22); }
.gap { flex:0 0 auto; width:30px; display:flex; align-items:center; justify-content:center;
       background:none; border:none; padding:0; font-family:inherit; }
.gap .bar { width:4px; height:46px; border-radius:3px; background:var(--track); transition:all .2s; }
.gap.live .bar { background:linear-gradient(180deg,var(--grad-a),var(--grad-b)); cursor:pointer; }
.gap.live:active .bar { transform:scaleX(2); }
.gap.zu { opacity:.28; }
.gap.sel .bar { width:15px; height:60px; background:linear-gradient(180deg,var(--grad-a),var(--grad-b));
                box-shadow:0 6px 18px rgba(158,34,180,.40); }
.tlempty { font-size:13px; color:var(--muted); padding:14px 0; }

/* ── Gegner-Leiste (kompakt) ──────────────────────────────────── */
.oppo { width:100%; max-width:400px; flex-shrink:0; }
/* Auf dem Handy existiert dieser Container nicht als Box: seine Kinder
   liegen direkt in der Spalte, genau wie vor der Desktop-Ansicht. */
.rechts { display:contents; }

/* Punktestand: bis zwei Spieler nebeneinander, ab drei zweispaltig und
   kompakter, damit die Kacheln nicht zerquetscht werden. */
.score.viele { display:grid; grid-template-columns:repeat(2,1fr); gap:7px; }
.score.viele .seat { padding:6px 10px; }
.score.viele .seat .nm { font-size:11px; }
.score.viele .seat .ct { font-size:17px; }
.score.viele .vlabel { display:none; }
.score.viele .vpunkt { width:6px; height:6px; }

.hinweis { width:100%; max-width:400px; flex-shrink:0; font-size:12px; font-weight:600;
           color:var(--muted); text-align:center; min-height:0; }
.hinweis:not(:empty) { padding:2px 0; }

/* Verlassen-Knopf: klein, oben rechts, mit Rückfrage */
.raus { position:absolute; z-index:5; top:max(env(safe-area-inset-top),10px); right:18px;
        padding:4px 2px; border:none; background:none; cursor:pointer;
        font-family:inherit; font-size:12px; font-weight:600; line-height:1.2;
        color:var(--muted); -webkit-appearance:none; transition:color .2s; }
.raus.frag { color:var(--red); }

/* Gegenstück dazu, oben links auf dem Startbildschirm: führt zur Anleitung
   für den Online-Modus. Dieselbe Zurückhaltung wie beim Verlassen-Knopf –
   die Knöpfe in der Mitte sollen den Blick behalten. */
.hilfe { position:absolute; z-index:5; top:max(env(safe-area-inset-top),10px); left:18px;
         display:inline-flex; align-items:center; gap:6px; padding:4px 2px;
         font-family:inherit; font-size:12px; font-weight:600; line-height:1.2;
         color:var(--muted); text-decoration:none; transition:color .2s; }
.hilfe svg { width:14px; height:14px; flex-shrink:0; display:block; }
.hilfe:active { opacity:.6; }

/* ── Veto-Phase ────────────────────────────────────────────────── */
.vetobox { position:absolute; inset:0; display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:10px; text-align:center;
           background:var(--surface); border:1px solid var(--border); border-radius:20px;
           padding:20px; box-shadow:0 8px 28px rgba(40,30,80,.05);
           animation:pop .3s cubic-bezier(.34,1.56,.64,1) both; }
.vetobox.scharf { border-color:transparent; box-shadow:0 0 0 2px var(--red), 0 8px 28px rgba(232,0,61,.14); }
.vetoTitel { font-size:15px; font-weight:700; line-height:1.3; }
.vetoText { font-size:12px; color:var(--muted); line-height:1.5; max-width:230px; }
/* Countdown als Ring: der Verlauf füllt sich im Uhrzeigersinn, die Sekunden
   stehen in der Mitte. Der Fortschritt läuft über stroke-dashoffset – eine
   Alternative über conic-gradient könnte den Verlauf nicht gleichzeitig
   diagonal führen und den Kreis anschneiden. */
.vetoRing { position:relative; width:74px; height:74px; flex-shrink:0; }
.vetoRing svg { width:100%; height:100%; display:block; overflow:visible; }
.vetoRing circle { fill:none; stroke-width:4; }
.vetoRing .spur { stroke:var(--track); opacity:.45; }
/* Der Übergang federt die 250-ms-Schritte des Ticks zu einem gleichmäßigen
   Lauf ab – linear, damit er nicht am Ende jedes Schritts stockt. */
.vetoRing .fuellung { stroke:url(#vetoGrad); stroke-linecap:round;
                      transition:stroke-dashoffset .25s linear; }
/* stop-color als CSS-Eigenschaft, nicht als Attribut: nur so greifen die
   Farbvariablen aus :root. Ausgewählt über die Verlaufs-ID statt über
   .vetoRing – sonst fällt der Strich auf Schwarz zurück, sobald die Defs
   einmal woanders stehen. */
#vetoGrad stop.a { stop-color:var(--grad-a); }
#vetoGrad stop.m { stop-color:var(--grad-mid); }
#vetoGrad stop.b { stop-color:var(--grad-b); }
/* Zahl und Einheit als eigene Elemente: vetoTick schreibt nur in .vetoZeit,
   ein gemeinsames textContent würde die Einheit bei jedem Tick löschen. */
.vetoMitte { position:absolute; inset:0; display:flex; flex-direction:column;
             align-items:center; justify-content:center; line-height:1; }
/* Auch am Ende schwarz – wie knapp es wird, zeigt der Ring. */
.vetoZeit { font-size:21px; font-weight:700; font-variant-numeric:tabular-nums;
            color:var(--text); }
.vetoEinheit { font-size:9px; font-weight:600; color:var(--muted); margin-top:3px; }

/* Vetozähler in der Punktestand-Kachel */
.vzeile { display:flex; align-items:center; gap:8px; }
.vpunkte { display:flex; gap:3px; }
.vpunkt { width:7px; height:7px; border-radius:50%; background:var(--text); }
.vpunkt.weg { background:var(--track); }
.vlabel { font-size:9px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }

/* Eingeloggte, noch nicht ausgewertete Karte in der Zeitleiste */
.tlcard.offen { background:var(--surface); border:2px dashed var(--grad-mid); box-shadow:none;
                display:flex; align-items:center; justify-content:center; }
.tlcard.offen .fr { font-size:24px; font-weight:700; color:var(--grad-mid); }

/* ── Bestenliste & Statistik ───────────────────────────────────── */
.statwrap { width:100%; max-width:520px; display:flex; flex-direction:column; gap:12px; flex-shrink:0; }
.statblock { background:var(--surface); border:1px solid var(--border); border-radius:18px;
             padding:15px 17px; box-shadow:0 6px 22px rgba(40,30,80,.04); }
.statTitel { font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
             color:var(--muted); margin-bottom:9px; }
.statleer { font-size:13px; color:var(--muted); padding:4px 0; }
.zeile { display:flex; align-items:center; gap:10px; font-size:13px; padding:6px 0; }
.zeile + .zeile { border-top:1px solid var(--border); }
.zeile.selbst .znam { color:var(--grad-mid); }
.rang { width:20px; flex-shrink:0; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; }
.znam { flex:1; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.zdat { font-size:11px; color:var(--muted); flex-shrink:0; font-variant-numeric:tabular-nums; }
.zwert { font-weight:700; flex-shrink:0; font-variant-numeric:tabular-nums; min-width:26px; text-align:right; }
.quote { display:flex; align-items:center; gap:9px; padding:4px 0; font-size:13px; }
.qlabel { width:104px; flex-shrink:0; font-weight:600; overflow:hidden;
          text-overflow:ellipsis; white-space:nowrap; }
/* display:block ist nötig: als inline-Element würden width und height am
   Füllstand nicht greifen und der Balken bliebe überall gleich leer. */
.qbar { flex:1; display:block; height:8px; background:var(--track); border-radius:4px;
        overflow:hidden; min-width:30px; }
.qfill { display:block; height:100%; border-radius:4px;
         background:linear-gradient(90deg,var(--grad-a),var(--grad-b)); }
.qzahl { width:78px; flex-shrink:0; text-align:right; font-size:11px; color:var(--muted);
         font-variant-numeric:tabular-nums; }
.seg { display:flex; gap:5px; width:100%; max-width:520px; background:var(--surface);
       border:1px solid var(--border); border-radius:13px; padding:4px; }
.segbtn { flex:1; border:none; background:none; font-family:inherit; font-size:13px; font-weight:600;
          color:var(--muted); padding:9px 6px; border-radius:9px; cursor:pointer; -webkit-appearance:none; }
.segbtn.on { color:#fff; background:linear-gradient(135deg,var(--grad-a),var(--grad-mid) 55%,var(--grad-b)); }
.oppo .tllabel { margin-bottom:4px; }
.oppo .row { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
.oppo .row::-webkit-scrollbar { display:none; }
.chip { flex:0 0 auto; font-size:11px; font-weight:600; padding:5px 9px; border-radius:50px;
        background:var(--surface); border:1px solid var(--border); color:var(--muted); }

.cf { position:fixed; inset:0; pointer-events:none; z-index:999; overflow:hidden; }
.err-banner { width:100%; max-width:400px; background:#FDECEF; border:1px solid #F5C2CE; color:var(--red);
              border-radius:14px; padding:12px 14px; font-size:13px; line-height:1.5; flex-shrink:0; }

/* ══ Desktop ══════════════════════════════════════════════════════
   Ausgelöst über die Fensterbreite, nicht über Geräteerkennung: die
   User-Agent-Auswertung veraltet ständig und trifft weder ein schmal
   gezogenes Desktop-Fenster noch ein iPad in beiden Ausrichtungen
   richtig. Wer das Fenster verkleinert, bekommt die Handy-Ansicht.  */
@media (min-width:900px) {

  /* Einstiegsbildschirme mittig statt oben klebend */
  #homeScreen, #lobbyScreen, #overScreen { justify-content:center; }
  .logo img { width:180px; }

  /* Links die Karte, rechts Punktestand, Zeitleiste und Aktionen. Die
     DOM-Reihenfolge bleibt unangetastet, die Zuordnung macht das Raster.
     Die Spaltenbreiten begrenzen sich selbst, damit es auf sehr breiten
     Bildschirmen nicht auseinanderläuft. */
  #gameScreen {
    /* Feste Spaltenbreite statt auto: beim Ziehen und Anspielen ist die
       Bühne leer (Player und Balken sind absolut positioniert), eine
       auto-Spalte fiele dann auf null zusammen und der Player rutschte
       aus dem Bild. */
    --kartengroesse:min(46vh,340px);
    display:grid; align-content:center; justify-content:center;
    column-gap:34px; row-gap:14px;
    /* Deckel bei 720 statt 880: die rechte Spalte beanspruchte sonst mehr
       Breite als ihr Inhalt nutzt, wodurch rechts eine Leerfläche entstand
       und das Spiel nach links gedrückt wirkte. Schmaler heißt: es bleibt
       Platz übrig, und justify-content:center kann tatsächlich zentrieren. */
    grid-template-columns:var(--kartengroesse) minmax(340px,720px);
    /* Alle Zeilen inhaltsgroß – eine 1fr-Zeile würde die Resthöhe
       schlucken und die Verdict-Zeile an den Fensterboden schieben. */
    grid-template-rows:auto auto auto;
    grid-template-areas:
      "buehne  score"
      "buehne  rechts"
      "verdict rechts";
    padding:48px 40px 32px;
  }
  .raus { top:20px; right:32px; font-size:13px; }
  .hilfe { top:20px; left:32px; font-size:13px; }
  .hilfe svg { width:15px; height:15px; }
  .hilfe:hover { color:var(--text); }
  /* Füllt die Spalte: bei 720 px sind das 353 px pro Kachel, und die rechte
     Spalte wirkt als zusammenhängender Block statt halb leer. */
  #gameScreen > .score   { grid-area:score;  align-self:start; max-width:none; }
  #gameScreen > .buehne  { grid-area:buehne; align-self:start;
                           width:var(--kartengroesse); height:var(--kartengroesse); }
  #gameScreen > .verdict { grid-area:verdict; max-width:none; }
  #gameScreen > .rechts  { grid-area:rechts; display:flex; flex-direction:column;
                           justify-content:flex-start; gap:18px; min-width:0; }
  /* Auf dem Handy darf der Balken breiter als die Karte sein, hier nicht. */
  #gameScreen .punten    { width:var(--kartengroesse); }

  /* Die Breite kommt der Zeitleiste zugute: statt drei Karten wie auf dem
     Handy sind hier sieben bis acht gleichzeitig sichtbar. Die Größe der
     Miniaturen bleibt, damit die Titel lesbar sind. */
  #gameScreen .tlwrap, #gameScreen .oppo, #gameScreen .actions { max-width:none; }

  /* Aktionen nebeneinander – der Abbruch muss am Rechner nicht so breit
     sein wie der Hauptknopf. */
  #gameScreen .actions { flex-direction:row; gap:14px; align-items:stretch; }
  /* width:auto ist nötig: mit den geerbten width:100% würde der Hauptknopf
     die ganze Zeile beanspruchen und den Abbruch hinausschieben. */
  #gameScreen .actions .btn { width:auto; }
  /* Alle Hauptknöpfe gleich breit, egal ob aktiv („Karte ziehen“) oder
     als Hinweis ausgegraut („Tippe eine Lücke…“). Vorher dehnte sich nur
     der aktive, weil allein er die Klasse prim trägt. */
  #gameScreen .actions .btn:not(.ghost) { flex:1; min-width:0; }
  #gameScreen .actions .btn.ghost { flex:0 0 auto; white-space:nowrap; padding:5px 18px; }

  /* Maus statt Finger: hier darf auf Hover reagiert werden. */
  .gap.live:hover .bar { background:linear-gradient(180deg,var(--grad-a),var(--grad-b));
                         transform:scaleX(1.8); }
  .btn { transition:transform .12s, box-shadow .12s, border-color .12s, color .12s; }
  .btn.prim:not(:disabled):hover { transform:translateY(-1px);
                                   box-shadow:0 12px 30px rgba(158,34,180,.38); }
  .btn:not(.prim):not(.ghost):not(:disabled):hover { border-color:var(--grad-mid); }
  .btn.ghost:hover { color:var(--text); }
  .pbtn:not(:disabled):hover { transform:scale(1.04); }
}
</style>
</head>
