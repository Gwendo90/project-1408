<!-- Supabase liegt als eigenständige Datei im Repo statt von einem CDN zu
     kommen. Ein Modul mit fehlgeschlagenem Import wird gar nicht erst
     ausgeführt – dann reagiert kein einziger Knopf mehr, ohne jede
     Fehlermeldung. Als klassisches Skript kann das nicht passieren. -->
<script src="supabase.js"></script>
<script type="module">
const createClient = window.supabase?.createClient;

// ══ Konstanten ═══════════════════════════════════════════════════
const ZIEL = window.DUELL_ZIEL || 10;
const CODE_ALPHABET = 'ACDEFGHJKLMNPQRTUVWXY34679';   // ohne verwechselbare Zeichen
const STORE_KEY = 'duell1408';
const SOLO_KEY  = 'duell1408solo';      // laufende Solo-Partie
const BEST_KEY  = 'duell1408best';      // Bestwert im Solo-Modus
const SOLO_FEHLER = 3;                  // nach dem dritten Fehler ist Schluss
const VETOS_START = 3;                  // Vetos je Spieler zu Spielbeginn
const VETO_MS = 15000;                  // Bedenkzeit fürs Veto
// Fortschrittsring des Countdowns. Radius im 44er-Viewport, Umfang daraus –
// so steht die Zahl an einer Stelle und nicht als Konstante im CSS daneben.
const VETO_R = 19;
const VETO_U = 2 * Math.PI * VETO_R;
// Fortschrittsring der Playbutton-Scheibe, Radius im 200er-Viewport.
const PLAY_R = 40;
const PLAY_U = 2 * Math.PI * PLAY_R;
// Vorlauf beim Autostart: beide Geräte bekommen Zeit, die Preview zu laden,
// damit der Song bei beiden wirklich bei Sekunde 0 beginnt statt mittendrin.
const VORLAUF_MS = 900;
// Wer beim Start einer Karte weniger als so viele Sekunden hinterherhinkt,
// hört sie trotzdem von vorn statt mittendrin einzusteigen. Die Spieler
// sitzen nicht im selben Raum – ein Versatz von ein, zwei Sekunden ist
// unhörbar, ein fehlender Songanfang wäre sofort spürbar.
const ANLAUF_KULANZ = 3;
const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';

// ══ Zustand (lokal) ══════════════════════════════════════════════
const aud = document.getElementById('aud');
let sb = null;                 // Supabase-Client
let SONGS = null;              // songs.json
let G = null;                  // { code, version, state }
let seat = null;               // 'p1' | 'p2' – wer bin ich?
let channel = null;
let pollTimer = null, tickTimer = null;
let clockOffset = 0;           // Serverzeit − lokale Zeit, in ms
let pendingGap = null;         // vorgemerkte Lücke, wartet auf Bestätigung
let audioUnlocked = false;
let lastRenderedCard = null;   // um Audio nur bei Kartenwechsel neu zu laden
let confettiShownFor = null;
let soloRekord = false;        // war die letzte Solo-Partie ein Bestwert?
let vorlaufTimer = null;       // wartet den Autostart-Vorlauf ab
let audioAnweisung = null;     // welche Audio-Anweisung ist schon umgesetzt?
let statSicht = 'ich';         // 'ich' oder 'alle' auf der Statistikseite
let partieProtokolliert = null; // verhindert doppelte Einträge derselben Partie
let vetoAblaufFuer = null;     // gegen doppeltes Durchlassen beim Ablauf
let rausFrage = null;          // Rückfrage-Timer des Verlassen-Knopfs

const $  = id => document.getElementById(id);
const SITZE = ['p1','p2','p3','p4'];
// Besetzte und nicht ausgestiegene Plätze, in fester Reihenfolge.
const aktive = st => SITZE.filter(k => st.seats?.[k] && !st.raus?.[k]);
const mitspieler = (st, ausser) => aktive(st).filter(k => k !== ausser);
const freierSitz = st => SITZE.find(k => !st.seats?.[k]);
function naechster(st, von) {
  const a = aktive(st);
  if (!a.length) return von;
  if (a.length < 2) return a[0];
  const i = a.indexOf(von);
  if (i >= 0) return a[(i + 1) % a.length];
  // "von" ist selbst ausgestiegen und steht nicht mehr in der Liste. Dann
  // ab seinem Platz in der Grundreihenfolge weitersuchen – sonst fiele der
  // Zug zurück auf den ersten Spieler statt an den Nachbarn zu gehen.
  const start = SITZE.indexOf(von);
  for (let n = 1; n <= SITZE.length; n++) {
    const k = SITZE[(start + n) % SITZE.length];
    if (a.includes(k)) return k;
  }
  return a[0];
}
const show = id => document.querySelectorAll('.screen')
  .forEach(s => s.classList.toggle('hidden', s.id !== id));
const setStat = (m,c) => { const e=$('stat'); e.textContent=m; e.className='stat'+(c?' '+c:''); };
const setHomeStat = (m,c) => { const e=$('homeStat'); e.textContent=m; e.className='stat'+(c?' '+c:''); };
const song = id => SONGS ? SONGS[id] : null;
const yearOf = id => parseInt(song(id).year, 10);
const serverNow = () => Date.now() + clockOffset;
const solo = () => !!(G && G.state.solo);

// ══ Start ════════════════════════════════════════════════════════
init();

async function init() {
  $('btnCreate').addEventListener('click', createGame);
  $('btnJoin').addEventListener('click', joinGame);
  $('btnSolo').addEventListener('click', startSolo);
  // Zwei Tipps zum Verlassen: der erste fragt nur nach, nach vier Sekunden
  // ohne Bestätigung fällt der Knopf in den Ruhezustand zurück.
  $('btnRaus').addEventListener('click', () => {
    const b = $('btnRaus');
    if (b.classList.contains('frag')) { rausZuruecksetzen(); leaveGame(); return; }
    b.classList.add('frag');
    b.textContent = 'Wirklich verlassen?';
    clearTimeout(rausFrage);
    rausFrage = setTimeout(rausZuruecksetzen, 4000);
  });
  $('btnStats').addEventListener('click', zeigeStatistik);
  $('btnStatsOver').addEventListener('click', zeigeStatistik);
  $('btnStatsBack').addEventListener('click', () => {
    // Zurück dorthin, wo man herkam. Beim Endbildschirm nur einblenden,
    // nicht neu zeichnen – renderOver würde sonst erneut Konfetti werfen.
    if (!G) show('homeScreen');
    else if (G.state.phase === 'over') show('overScreen');
    else render();
  });
  $('statSeg').addEventListener('click', e => {
    const b = e.target.closest('.segbtn');
    if (!b || b.dataset.sicht === statSicht) return;
    statSicht = b.dataset.sicht;
    [...$('statSeg').children].forEach(x => x.classList.toggle('on', x === b));
    zeigeStatistik();
  });
  $('btnLeaveLobby').addEventListener('click', leaveGame);
  $('btnHome').addEventListener('click', leaveGame);
  $('btnStart').addEventListener('click', startGame);
  $('btnAgain').addEventListener('click', playAgain);
  $('pbtn').addEventListener('click', togglePlay);
  $('codeInput').addEventListener('input', e => {
    e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);
  });
  // Beim ersten Antippen das Audio-Element für spätere programmatische
  // Wiedergabe freischalten (iOS/Android erlauben play() sonst nur direkt
  // aus einer Nutzergeste heraus – der wartende Spieler tippt aber nicht).
  document.addEventListener('pointerdown', unlockAudio, { once:true });

  aud.addEventListener('ended', onAudioEnded);

  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (saved?.name) $('nameInput').value = saved.name;
  zeigeBestwert();

  // Songs zuerst: die braucht auch der Solo-Modus, und der soll selbst
  // dann laufen, wenn Supabase klemmt.
  await loadSongs();

  try {
    if (!createClient)
      throw new Error('supabase.js wurde nicht geladen – liegt die Datei neben duell.html?');
    if (!window.SUPABASE_URL || window.SUPABASE_URL.includes('DEIN-PROJEKT'))
      throw new Error('Supabase ist noch nicht konfiguriert – trag URL und Key in duell-config.js ein.');
    sb = createClient(window.SUPABASE_URL, window.SUPABASE_KEY, {
      realtime: { params: { eventsPerSecond: 10 } }
    });
  } catch (e) { return fail(e.message + ' Solo spielen geht trotzdem.'); }

  await calibrateClock();

  // Laufendes Spiel? Dann direkt wieder rein – erst das Duell, sonst Solo.
  if (saved?.code && saved?.seat) {
    const { data } = await sb.from('games').select().eq('code', saved.code).maybeSingle();
    if (data && data.state.phase !== 'over') {
      seat = saved.seat; adopt(data); await subscribe(saved.code);
      return;
    }
  }
  const soloSt = JSON.parse(localStorage.getItem(SOLO_KEY) || 'null');
  if (soloSt && soloSt.phase !== 'over') { seat = 'p1'; G = { code:null, version:0, state:soloSt }; render(); }
}

function fail(msg) {
  const b = document.createElement('div');
  b.className = 'err-banner';
  b.textContent = '⚠️ ' + msg;
  $('homeScreen').insertBefore(b, $('homeScreen').children[1]);
  $('btnCreate').disabled = $('btnJoin').disabled = true;
}

function loadSongs() {
  return fetch('songs.json?v=' + Date.now())
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => { SONGS = d; })
    .catch(() => fail('Songdaten konnten nicht geladen werden – Internetverbindung prüfen.'));
}

// Die beiden Handys gehen unterschiedlich. Für die Audio-Synchronisation
// messen wir einmal den Versatz zur Serveruhr (dreimal, bester RTT gewinnt).
async function calibrateClock() {
  let best = Infinity;
  for (let i = 0; i < 3; i++) {
    const t0 = Date.now();
    const { data, error } = await sb.rpc('server_now');
    if (error) return;
    const rtt = Date.now() - t0;
    if (rtt < best) {
      best = rtt;
      clockOffset = new Date(data).getTime() + rtt / 2 - Date.now();
    }
  }
}

function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  const src = aud.src;
  aud.src = SILENT;
  aud.play().then(() => { aud.pause(); if (src) aud.src = src; }).catch(() => {});
}

// ══ Spiel anlegen / beitreten ════════════════════════════════════
function myName() {
  return ($('nameInput').value || '').trim().slice(0,14) || 'Spieler';
}

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function newCode() {
  let c = '';
  for (let i = 0; i < 5; i++) c += CODE_ALPHABET[Math.floor(Math.random()*CODE_ALPHABET.length)];
  return c;
}

async function createGame() {
  if (!SONGS) return setHomeStat('Songdaten laden noch…','');
  setHomeStat('Spiel wird angelegt…','');
  const state = {
    phase: 'lobby',
    ziel: ZIEL,
    seats: { p1: { name: myName() }, p2: null, p3: null, p4: null },
    raus: {},
    turn: 'p1',
    deck: shuffled(Object.keys(SONGS)),
    timelines: { p1: [], p2: [], p3: [], p4: [] },
    current: null,
    audio: { playing:false, startedAt:0, seek:0 },
    result: null,
    winner: null
  };
  for (let tries = 0; tries < 6; tries++) {
    const code = newCode();
    const { data, error } = await sb.from('games')
      .insert({ code, state, version: 0 }).select().maybeSingle();
    if (data) {
      seat = 'p1';
      adopt(data);
      await subscribe(code);
      return;
    }
    if (error && error.code !== '23505') return setHomeStat('Fehler: ' + error.message, 'err');
  }
  setHomeStat('Konnte keinen freien Code finden – nochmal versuchen.','err');
}

// ── Solo ─────────────────────────────────────────────────────────
// Läuft ohne Supabase: G wird lokal gehalten, commit() schreibt nicht
// ins Netz. Endlos ziehen, nach SOLO_FEHLER Fehlern ist Schluss.
function startSolo() {
  if (!SONGS) return setHomeStat('Songdaten laden noch…','');
  const deck = shuffled(Object.keys(SONGS));
  seat = 'p1';
  G = { code:null, version:0, state:{
    solo: true,
    phase: 'draw',
    ziel: Infinity,
    maxFehler: SOLO_FEHLER,
    fehler: 0,
    seats: { p1: { name: myName() }, p2: null },
    turn: 'p1',
    timelines: { p1: [deck.pop()], p2: [] },
    deck,
    current: null,
    audio: { playing:false, startedAt:0, seek:0 },
    result: null,
    winner: null
  }};
  localStorage.setItem(STORE_KEY, JSON.stringify({ name: myName() }));
  // Gleich sichern, sonst ginge die Partie bei einem Reload vor der ersten
  // Karte verloren – gespeichert wird sonst erst beim ersten commit().
  try { localStorage.setItem(SOLO_KEY, JSON.stringify(G.state)); } catch(e) {}
  render();
}

function bestwert() { return parseInt(localStorage.getItem(BEST_KEY) || '0', 10); }

function zeigeBestwert() {
  const b = bestwert();
  $('soloBest').textContent = b ? `Dein Bestwert: ${b} Karten` : '';
}

async function joinGame() {
  const code = ($('codeInput').value || '').trim().toUpperCase();
  if (code.length !== 5) return setHomeStat('Bitte den 5-stelligen Code eingeben.','err');
  setHomeStat('Suche Spiel…','');
  const { data, error } = await sb.from('games').select().eq('code', code).maybeSingle();
  if (error) return setHomeStat('Fehler: ' + error.message, 'err');
  if (!data)  return setHomeStat('Kein Spiel mit dem Code ' + code + '.','err');

  // Zurückkehrender Spieler? Dann den alten Platz wieder einnehmen.
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (saved?.code === code && saved?.seat && data.state.seats[saved.seat]) {
    seat = saved.seat; adopt(data); return subscribe(code);
  }
  if (data.state.phase !== 'lobby')
    return setHomeStat('Das Spiel läuft schon.','err');
  const platz = freierSitz(data.state);
  if (!platz) return setHomeStat('Das Spiel ist schon voll.','err');

  seat = platz;
  adopt(data);
  await subscribe(code);
  // Den Platz erst im Mutator festlegen: in der Zwischenzeit kann ihn
  // jemand anders belegt haben.
  const ok = await commit(s => {
    const frei = s.seats[seat] ? freierSitz(s) : seat;
    if (!frei) return null;
    seat = frei;
    s.seats[frei] = { name: myName() };
    return s;
  });
  if (!ok) { setHomeStat('Das Spiel ist schon voll.','err'); return leaveGame(); }
}

function rausZuruecksetzen() {
  clearTimeout(rausFrage);
  const b = $('btnRaus');
  if (b) { b.classList.remove('frag'); b.textContent = 'Spiel verlassen'; }
}

async function leaveGame() {
  // Aussteigen im laufenden Spiel eintragen, sonst warten die anderen
  // endlos auf einen Zug, der nie kommt.
  if (G && !G.state.solo && G.state.phase !== 'over' && sb) {
    const meinName = G.state.seats?.[seat]?.name || 'Ein Mitspieler';
    await commit(s => {
      if (s.phase === 'over' || !s.seats?.[seat]) return null;
      s.raus = s.raus || {};
      s.raus[seat] = true;
      s.timelines[seat] = [];
      s.hinweis = meinName + ' hat das Spiel verlassen';

      const rest = aktive(s);
      if (s.phase === 'lobby') { s.seats[seat] = null; delete s.raus[seat]; return s; }

      // Allein weiterzuspielen ergibt keinen Sinn.
      if (rest.length < 2) { s.verlassen = seat; s.phase = 'over'; }
      else {
        // Laufende Runde verwerfen: die Karte des Ausgestiegenen oder ein
        // von ihm angemeldetes Veto lassen sich nicht sinnvoll fortführen.
        if (s.turn === seat) s.turn = naechster(s, seat);
        if (s.phase !== 'draw') { s.current = null; s.result = null; s.phase = 'draw'; }
        s.pending = null; s.vetoBis = 0; s.vetoAngemeldet = null;
      }
      s.audio = { playing:false, startedAt:0, seek:0 };
      return s;
    });
  }
  localStorage.setItem(STORE_KEY, JSON.stringify({ name: myName() }));   // Name behalten
  localStorage.removeItem(SOLO_KEY);
  if (channel) { await sb.removeChannel(channel); channel = null; }
  clearInterval(pollTimer);
  stopAudio();
  G = null; seat = null; lastRenderedCard = null; confettiShownFor = null;
  pendingGap = null; soloRekord = false;
  setHomeStat('','');
  zeigeBestwert();
  show('homeScreen');
}

// ══ Realtime ═════════════════════════════════════════════════════
async function subscribe(code) {
  if (channel) await sb.removeChannel(channel);
  channel = sb.channel('game:' + code)
    .on('postgres_changes',
        { event:'UPDATE', schema:'public', table:'games', filter:'code=eq.'+code },
        p => adopt(p.new))
    .subscribe();

  // Fallback: Realtime kann bei Netzwechsel (WLAN → mobil) still abreißen.
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (!G) return;
    const { data } = await sb.from('games').select().eq('code', G.code).maybeSingle();
    if (data && data.version > G.version) adopt(data);
  }, 4000);
}

function adopt(row) {
  const vorher = G && G.state.phase;
  G = { code: row.code, version: row.version, state: row.state };
  // Bei jedem Phasenwechsel die vorgemerkte Lücke verwerfen: sonst würde
  // eine Auswahl aus dem eigenen Zug in die Veto-Auswahl hineinwirken.
  if (vorher !== row.state.phase) pendingGap = null;
  localStorage.setItem(STORE_KEY, JSON.stringify({ code: row.code, seat, name: myName() }));
  render();
}

// Schreiben mit optimistischem Sperren: nur wenn die Version noch stimmt.
// Bei Konflikt neu laden und den Mutator erneut anwenden.
async function commit(mutate) {
  // Solo: kein Netz, kein Sperren – einfach lokal anwenden und sichern.
  if (solo()) {
    const next = mutate(structuredClone(G.state));
    if (!next) return false;
    G = { code:null, version:G.version + 1, state:next };
    try { localStorage.setItem(SOLO_KEY, JSON.stringify(next)); } catch(e) {}
    render();
    return true;
  }
  for (let i = 0; i < 5; i++) {
    const next = mutate(structuredClone(G.state));
    if (!next) return false;
    const { data } = await sb.from('games')
      .update({ state: next, version: G.version + 1 })
      .eq('code', G.code).eq('version', G.version)
      .select().maybeSingle();
    if (data) { adopt(data); return true; }
    const fresh = await sb.from('games').select().eq('code', G.code).maybeSingle();
    if (!fresh.data) return false;
    adopt(fresh.data);
  }
  return false;
}

// ══ Spielablauf ══════════════════════════════════════════════════
async function startGame() {
  await commit(s => {
    const dabei = aktive(s);
    if (dabei.length < 2) return null;
    // Jeder startet mit einer aufgedeckten Karte.
    s.vetos = {};
    for (const k of dabei) {
      s.timelines[k] = [ s.deck.pop() ];
      s.vetos[k] = VETOS_START;
    }
    s.pending = null; s.vetoBis = 0; s.vetoAngemeldet = null; s.hinweis = null;
    s.turn = dabei[Math.floor(Math.random() * dabei.length)];
    s.phase = 'draw';
    return s;
  });
}

async function drawCard() {
  await commit(s => {
    if (s.phase !== 'draw' || s.turn !== seat) return null;
    s.current = s.deck.pop();
    // Läuft von selbst los. Der Vorlauf liegt in der Zukunft, damit beide
    // Geräte die Preview geladen haben, bevor Sekunde 0 fällt.
    s.audio = { playing:true, startedAt:serverNow() + VORLAUF_MS, seek:0 };
    s.result = null;
    s.phase = 'turn';
    return s;
  });
}

// Richtig einsortiert, wenn die Karte zwischen ihre beiden Nachbarn passt.
// Gleiche Jahre zählen als passend – bei 336 Songs auf 71 Jahrgänge ist
// das der Normalfall, nicht die Ausnahme.
function isCorrect(timeline, index, cardId) {
  const y = yearOf(cardId);
  const before = index > 0 ? yearOf(timeline[index-1]) : -Infinity;
  const after  = index < timeline.length ? yearOf(timeline[index]) : Infinity;
  return before <= y && y <= after;
}

// Wertet die eingeloggte Platzierung aus – und, falls eines eingelegt
// wurde, das Veto des Gegners. Reine Zustandsänderung, damit sie aus
// mehreren Stellen heraus im Mutator laufen kann.
//
// Regel: Ein Veto zieht nur, wenn der Spieler am Zug daneben lag UND der
// Vetogeber selbst richtig liegt. Gegen eine korrekte Platzierung geht das
// Veto also immer verloren – das ist der Preis fürs Misstrauen.
function auswerten(s, vetoZug) {
  const aktiv   = s.pending.seat;
  const idx     = s.pending.index;
  const id      = s.current;
  const tlAktiv = s.timelines[aktiv];
  const aktivOk = isCorrect(tlAktiv, idx, id);

  let klau = null;
  if (vetoZug && !s.solo) {
    const g = vetoZug.seat;
    s.vetos[g] = Math.max(0, (s.vetos[g] || 0) - 1);
    // Geprüft wird in der Leiste des Spielers am Zug – dieselbe Aufgabe,
    // an der er gescheitert ist. Gelingt es, wird die Karte anschließend
    // an der passenden Stelle in die eigene Leiste einsortiert.
    const gOk = !aktivOk && isCorrect(tlAktiv, vetoZug.index, id);
    let ziel = -1;
    if (gOk) {
      ziel = einsortierIndex(s.timelines[g], id);
      s.timelines[g].splice(ziel, 0, id);
      s.vetos[g]++;                       // korrektes Veto bleibt erhalten
    }
    klau = { seat: g, index: vetoZug.index, zielIndex: ziel, gelungen: gOk };
  }

  if (aktivOk) tlAktiv.splice(idx, 0, id);

  s.result = { seat: aktiv, id, index: idx, correct: aktivOk, klau };
  s.pending = null;
  s.vetoBis = 0;
  s.vetoAngemeldet = null;
  s.audio = { playing:false, startedAt:0, seek:0 };
  s.phase = 'result';

  if (s.solo) {
    if (!aktivOk) s.fehler++;
    // Nach dem letzten Leben bleibt die Auflösung stehen, statt sofort zum
    // Endbildschirm zu springen: sonst sieht man nie, welches Jahr es war –
    // also genau bei dem Fehler nicht, der die Partie beendet hat. Zum
    // Ergebnis geht es erst auf Tastendruck (siehe naechsteKarte).
    //
    // Gewertet wird trotzdem sofort. Wer den Tab an dieser Stelle zumacht,
    // soll seinen Lauf nicht verlieren.
    //
    // Der Bestwert muss hier fallen, nicht nach dem commit: im Solo-Modus
    // zeichnet commit() sofort neu, und renderOver liest soloRekord.
    if (s.fehler >= s.maxFehler) { s.soloAus = true; merkeBestwert(tlAktiv.length); }
  } else {
    for (const k of aktive(s)) {
      if (s.timelines[k].length >= s.ziel) { s.phase = 'over'; s.winner = k; }
    }
  }
  return s;
}

// Verbindliches Festlegen der Position. Hat der Gegner noch Vetos, folgt
// erst die Veto-Phase; sonst wird direkt ausgewertet.
// Wohin gehört die Karte in dieser (sortierten) Leiste? Bei gleichen
// Jahren die vorderste passende Stelle – bleibt in jedem Fall sortiert.
function einsortierIndex(tl, id) {
  const y = yearOf(id);
  let i = 0;
  while (i < tl.length && yearOf(tl[i]) < y) i++;
  return i;
}

async function einloggen(index) {
  const ok = await commit(s => {
    if (s.phase !== 'turn' || s.turn !== seat || !s.current) return null;
    s.pending = { seat, index };
    const kannVeto = mitspieler(s, seat).some(k => (s.vetos?.[k] || 0) > 0);
    // Geht es ohne Veto-Fenster direkt weiter, hält auswerten() den Ton an.
    if (s.solo || !kannVeto) return auswerten(s, null);
    // Sonst läuft er absichtlich weiter: wer über ein Veto nachdenkt, muss
    // den Song dabei noch hören. Angehalten wird erst in auswerten().
    s.phase = 'veto';
    s.vetoBis = serverNow() + VETO_MS;
    s.vetoAngemeldet = null;
    return s;
  });
  if (ok) nachAuswertung();
}

// Gegner meldet das Veto an. Damit stoppt der Countdown – das Aussuchen
// der Lücke soll nicht unter Zeitdruck stehen, und der Spieler am Zug
// erfährt sofort, dass es ernst wird.
async function vetoAnmelden() {
  await commit(s => {
    if (s.phase !== 'veto' || s.turn === seat || s.vetoAngemeldet) return null;
    if ((s.vetos?.[seat] || 0) <= 0) return null;
    s.vetoAngemeldet = seat;
    s.vetoBis = 0;
    return s;
  });
}

async function vetoZurueck() {
  await commit(s => {
    if (s.phase !== 'veto' || s.vetoAngemeldet !== seat) return null;
    s.vetoAngemeldet = null;
    s.vetoBis = serverNow() + VETO_MS;
    return s;
  });
}

async function vetoSetzen(index) {
  const ok = await commit(s => {
    if (s.phase !== 'veto' || s.vetoAngemeldet !== seat) return null;
    return auswerten(s, { seat, index });
  });
  if (ok) nachAuswertung();
}

// Durchlassen: entweder der Gegner tippt es an, oder der Countdown läuft
// ab. Beide Geräte dürfen das schreiben – wer zuerst kommt, gewinnt, der
// zweite Versuch findet die Phase schon verändert vor und verpufft.
async function durchlassen() {
  const ok = await commit(s => {
    if (s.phase !== 'veto' || s.vetoAngemeldet) return null;
    return auswerten(s, null);
  });
  if (ok) nachAuswertung();
}

// Läuft genau auf dem Gerät, dessen commit durchgegangen ist – also genau
// einmal je Auswertung, egal wer sie ausgelöst hat.
function nachAuswertung() {
  const st = G.state;
  const r = st.result;
  if (r) {
    tippMerken(r.seat, r.id, r.correct);
    // Den Tipp des Vetogebers nur zählen, wenn er auch geprüft wurde. Gegen
    // eine korrekte Platzierung scheitert das Veto per Regel, ohne dass
    // seine Lücke je angeschaut wurde – das wäre kein Wissensnachweis.
    if (r.klau && !r.correct) tippMerken(r.klau.seat, r.id, r.klau.gelungen);
  }
  // soloAus zählt wie 'over': die Partie ist entschieden, nur der
  // Endbildschirm wartet noch auf den Spieler.
  if (st.phase === 'over' || st.soloAus) partieMerken();
}

// Bestwert ist die Länge der Zeitleiste, wenn der dritte Fehler fällt.
// Erst vergleichen, dann speichern – sonst wäre der alte Wert schon weg.
function merkeBestwert(n) {
  soloRekord = n > bestwert();
  if (soloRekord) localStorage.setItem(BEST_KEY, String(n));
}

// Nach der Auflösung in einem Schritt: Zug abgeben und gleich die nächste
// Karte aufdecken. Vorher waren das zwei Tipps ("Weiter", dann "Karte
// ziehen"), was sich doppelt anfühlte.
async function naechsteKarte() {
  const ok = await commit(s => {
    if (s.phase !== 'result') return null;
    // Solo nach dem letzten Leben: die Karte wurde gezeigt, jetzt zum
    // Ergebnis. Gewertet ist die Partie längst (siehe auswerten).
    if (s.soloAus) { s.phase = 'over'; s.result = null; return s; }
    if (!s.solo) s.turn = naechster(s, s.turn);
    s.result = null;
    s.hinweis = null;
    if (!s.deck.length) {
      s.phase = 'over';
      s.current = null;
      if (!s.solo && !s.winner) {
        // Deck leer: die meisten Karten gewinnen, bei Gleichstand niemand.
        const dabei = aktive(s);
        const best = Math.max(...dabei.map(k => s.timelines[k].length));
        const fuehrende = dabei.filter(k => s.timelines[k].length === best);
        s.winner = fuehrende.length === 1 ? fuehrende[0] : null;
      }
      return s;
    }
    s.current = s.deck.pop();
    s.audio = { playing:true, startedAt:serverNow() + VORLAUF_MS, seek:0 };
    s.phase = 'turn';
    return s;
  });
  // Deck leer: hier endet die Partie, ohne dass eingeloggt wurde.
  if (ok && G.state.phase === 'over') partieMerken();
}

async function playAgain() {
  if (solo()) return startSolo();
  await commit(s => {
    s.deck = shuffled(Object.keys(SONGS));
    const dabei = aktive(s);
    s.timelines = {}; s.vetos = {};
    for (const k of SITZE) s.timelines[k] = [];
    for (const k of dabei) { s.timelines[k] = [s.deck.pop()]; s.vetos[k] = VETOS_START; }
    s.pending   = null; s.vetoBis = 0; s.vetoAngemeldet = null; s.hinweis = null;
    s.turn      = dabei[Math.floor(Math.random() * dabei.length)];
    s.current   = null;
    s.result    = null;
    s.winner    = null;
    s.audio     = { playing:false, startedAt:0, seek:0 };
    s.phase     = 'draw';
    return s;
  });
}

// ══ Statistik schreiben ══════════════════════════════════════════
// Beide Funktionen laufen absichtlich ohne await im Spielablauf: ein
// langsames Netz soll den Zug nicht aufhalten, und ein Fehlschlag darf
// das Spiel nicht stören. Schlimmster Fall: ein Eintrag fehlt.

// Der Name aus der laufenden Partie geht vor dem Eingabefeld: dort könnte
// zwischenzeitlich etwas anderes stehen, die Statistik würde dann dem
// falschen Spieler zugeschrieben.
function statName() {
  return (G && seat && G.state.seats?.[seat]?.name) || myName();
}

// Der Name kommt aus dem Zustand, nicht vom Gerät: bei einem Veto schreibt
// der Gegner die Auswertung, protokolliert dabei aber den Tipp des Spielers
// am Zug. Über myName() wäre er dem Falschen zugeschrieben worden.
function tippMerken(sitz, songId, korrekt) {
  if (!sb || !G) return;
  const s = song(songId);
  const name = G.state.seats?.[sitz]?.name;
  if (!s || !name) return;
  sb.from('tipps').insert({
    name,
    modus:   G.state.solo ? 'solo' : 'duell',
    song_id: songId,
    jahr:    parseInt(s.year, 10),
    land:    s.country,
    korrekt: !!korrekt
  }).then(({ error }) => { if (error) console.warn('Tipp nicht gespeichert:', error.message); });
}

// Im Duell schreibt der Client, der die Partie beendet hat, beide Zeilen.
// Sonst würden entweder zwei Einträge je Spieler entstehen oder – wenn
// jeder nur sich selbst einträgt – der Eintrag des Gegners fehlen, falls
// dessen Gerät die Partie nie zu Ende sieht.
function partieMerken() {
  if (!sb || !G) return;
  const st = G.state;
  const schluessel = (G.code || 'solo') + '|' +
    SITZE.map(k => (st.timelines[k] || []).length).join('-');
  if (partieProtokolliert === schluessel) return;
  partieProtokolliert = schluessel;

  const zeilen = st.solo
    ? [{ name: st.seats.p1.name, modus: 'solo',
         karten: st.timelines.p1.length, gewonnen: null, gegner: null }]
    : aktive(st).map(k => ({
        name:     st.seats[k].name,
        modus:    'duell',
        karten:   st.timelines[k].length,
        gewonnen: st.winner ? st.winner === k : null,
        gegner:   mitspieler(st, k).map(j => st.seats[j].name).join(', ') || null
      }));

  sb.from('partien').insert(zeilen)
    .then(({ error }) => { if (error) console.warn('Partie nicht gespeichert:', error.message); });
}

// ══ Statistik anzeigen ═══════════════════════════════════════════
async function zeigeStatistik() {
  show('statsScreen');
  if (!sb) {
    ['statBesten','statDuell','statJahrzehnt','statLand'].forEach(id => {
      $(id).className = 'statleer';
      $(id).textContent = 'Ohne Verbindung zur Datenbank nicht verfügbar.';
    });
    return;
  }
  const wer = statSicht === 'ich' ? statName() : null;
  ['statBesten','statDuell','statJahrzehnt','statLand'].forEach(id => {
    $(id).className = 'statleer'; $(id).textContent = 'lädt…';
  });

  const [besten, bilanz, jz, land] = await Promise.all([
    sb.rpc('bestenliste', { p_limit: 10 }),
    sb.rpc('duellbilanz'),
    sb.rpc('quote_jahrzehnt', { p_name: wer }),
    sb.rpc('quote_land',      { p_name: wer })
  ]);

  zeichneBesten(besten);
  zeichneBilanz(bilanz);
  zeichneQuote('statJahrzehnt', jz, r => r.jahrzehnt + 'er', 0);
  zeichneQuote('statLand',      land, r => r.land, 3, 10);
}

function statFehler(id, error) {
  $(id).className = 'statleer';
  $(id).textContent = /does not exist|schema cache/i.test(error.message || '')
    ? 'Tabellen fehlen noch – supabase-statistik.sql einspielen.'
    : 'Fehler: ' + error.message;
}

function zeichneBesten({ data, error }) {
  if (error) return statFehler('statBesten', error);
  const el = $('statBesten');
  if (!data || !data.length) {
    el.className = 'statleer';
    el.textContent = 'Noch keine Solo-Partie beendet.';
    return;
  }
  const ich = statName();
  el.className = '';
  el.innerHTML = data.map((r, i) => `
    <div class="zeile${r.name === ich ? ' selbst' : ''}">
      <span class="rang">${i + 1}</span>
      <span class="znam">${esc(r.name)}</span>
      <span class="zdat">${new Date(r.beendet_am).toLocaleDateString('de-DE',
        { day:'2-digit', month:'2-digit', year:'2-digit' })}</span>
      <span class="zwert">${r.karten}</span>
    </div>`).join('');
}

function zeichneBilanz({ data, error }) {
  if (error) return statFehler('statDuell', error);
  const el = $('statDuell');
  if (!data || !data.length) {
    el.className = 'statleer';
    el.textContent = 'Noch keine Partie zu zweit oder mehr beendet.';
    return;
  }
  const ich = statName();
  el.className = '';
  el.innerHTML = data.map(r => `
    <div class="zeile${r.name === ich ? ' selbst' : ''}">
      <span class="znam">${esc(r.name)}</span>
      <span class="zdat">${r.spiele} ${r.spiele === 1 ? 'Spiel' : 'Spiele'}</span>
      <span class="zwert">${r.siege} ✓</span>
    </div>`).join('');
}

// mindestens: unter so vielen Tipps ist eine Quote nicht aussagekräftig
function zeichneQuote(id, { data, error }, beschriftung, mindestens, grenze) {
  if (error) return statFehler(id, error);
  const el = $(id);
  let rows = (data || []).filter(r => Number(r.gesamt) >= (mindestens || 0));
  if (grenze) rows = rows.slice(0, grenze);
  if (!rows.length) {
    el.className = 'statleer';
    el.textContent = mindestens
      ? `Noch zu wenig Daten – ab ${mindestens} Tipps je Land wird gezählt.`
      : 'Noch keine Tipps erfasst.';
    return;
  }
  el.className = '';
  el.innerHTML = rows.map(r => {
    const g = Number(r.gesamt), k = Number(r.richtig);
    const p = Math.round(k / g * 100);
    return `<div class="quote">
      <span class="qlabel">${esc(beschriftung(r))}</span>
      <span class="qbar"><span class="qfill" style="width:${p}%"></span></span>
      <span class="qzahl">${p} % · ${k}/${g}</span>
    </div>`;
  }).join('');
}

// ══ Audio ════════════════════════════════════════════════════════
// Der Spieler am Zug steuert, beide hören. Statt den Ton zu streamen
// synchronisieren wir nur den Startzeitpunkt: beide laden dieselbe
// iTunes-Preview und springen an dieselbe Stelle.
async function togglePlay() {
  if (!G || G.state.turn !== seat) return;
  const playing = G.state.audio.playing;
  const pos = aud.currentTime || 0;
  await commit(s => {
    s.audio = playing
      ? { playing:false, startedAt:0, seek:pos }
      : { playing:true,  startedAt:serverNow(), seek:(aud.duration && pos >= aud.duration - .3 ? 0 : pos) };
    return s;
  });
}

function targetTime(a) {
  return a.playing ? a.seek + (serverNow() - a.startedAt) / 1000 : a.seek;
}

function syncAudio(st) {
  const s = song(st.current);
  if (!s) return stopAudio();
  if (lastRenderedCard !== st.current) {
    lastRenderedCard = st.current;
    aud.src = s.pr;
    aud.load();
    setFortschritt(0);
    $('tlbl').textContent = '—';
  }
  // Die Previews sind unterschiedlich lang – im Katalog überwiegend 90 s,
  // vereinzelt 30 s. Vor den Metadaten kennen wir die Länge nicht, also
  // erst dann springen und starten.
  if (!aud.duration) {
    // Komplett neu zeichnen statt nur nachsynchronisieren, damit auch der
    // Statustext aus dem "Lädt…" herauskommt.
    aud.addEventListener('loadedmetadata', () => { if (G) render(); }, { once:true });
    return 'laedt';
  }
  const want = targetTime(st.audio);

  // Vorlauf läuft noch: beide Geräte warten auf Position 0, damit der Song
  // wirklich bei beiden von vorn beginnt und nicht mittendrin einsteigt.
  if (st.audio.playing && want < 0) {
    if (!aud.paused) aud.pause();
    if (aud.currentTime) aud.currentTime = 0;
    clearTimeout(vorlaufTimer);
    vorlaufTimer = setTimeout(() => { if (G) render(); }, Math.min(2000, -want * 1000) + 60);
    return 'vorlauf';
  }

  // Der wartende Spieler schreibt nie in den Zustand. Läuft die Preview
  // aus, während er zusieht, bleibt dort also "playing: true" stehen. Wer
  // danach neu lädt oder das Handy entsperrt, würde sonst eine tote
  // Anzeige sehen – deshalb hier auf "durchgelaufen" erkennen.
  if (st.audio.playing && want >= aud.duration) {
    if (!aud.paused) aud.pause();
    setFortschritt(1);
    $('tlbl').textContent = '0:00';
    return 'fertig';
  }

  // Jede Audio-Anweisung genau einmal umsetzen statt laufend auf die
  // Sollposition nachzuregeln. Das Nachregeln würde einen Start von vorn
  // sofort wieder wegkorrigieren – und nötig ist es nicht, weil Audio-Uhren
  // über 90 Sekunden nicht nennenswert auseinanderlaufen.
  const anweisung = `${st.current}|${st.audio.playing}|${st.audio.startedAt}|${st.audio.seek}`;
  if (anweisung !== audioAnweisung) {
    audioAnweisung = anweisung;
    if (st.audio.playing) {
      // Kartenstart: lieber von vorn als mittendrin (siehe ANLAUF_KULANZ).
      aud.currentTime = (!st.audio.seek && want < ANLAUF_KULANZ) ? 0 : Math.max(0, want);
      aud.play()
        .then(() => { if (G) render(); })         // Status von "Lädt…" auf "läuft"
        .catch(() => {
          audioAnweisung = null;                  // beim nächsten Zeichnen erneut versuchen
          setStat('Tippe einmal auf den Bildschirm, um Ton zu erlauben','err');
        });
    } else {
      aud.pause();
      aud.currentTime = Math.max(0, want);
    }
  }
  if (!st.audio.playing) return 'pause';
  return aud.paused ? 'laedt' : 'laeuft';
}

// Fortschritt des Songs als Fuellstand des aeusseren Rings, 0 bis 1.
// Loest den frueheren Balken ab – gezeichnet wird ueber stroke-dashoffset.
function setFortschritt(anteil) {
  const el = $('pfill');
  if (!el) return;
  const a = Math.min(1, Math.max(0, anteil || 0));
  el.setAttribute('stroke-dashoffset', (PLAY_U * (1 - a)).toFixed(2));
}

function fmtTime(sec) {
  const r = Math.max(0, Math.ceil(sec));
  return Math.floor(r/60) + ':' + String(r%60).padStart(2,'0');
}

// Sobald die Länge bekannt ist, im Ruhezustand die Gesamtdauer anzeigen.
aud.addEventListener('loadedmetadata', () => {
  if (aud.paused && aud.duration) $('tlbl').textContent = fmtTime(aud.duration);
});

// Beide Geräte kennen die Deck-Reihenfolge, also lässt sich die nächste
// Preview schon laden, während noch aufgelöst wird. Der Browser hat sie
// dann im Cache und der Autostart trifft Sekunde 0 – gerade beim wartenden
// Spieler, der den Zustand erst über Realtime bekommt. Kostet keine
// zusätzlichen Daten, die Datei würde ohnehin gleich gebraucht.
let vorladeEl = null, vorgeladen = null;
function ladeNaechsteVor(st) {
  const naechste = st.deck[st.deck.length - 1];
  if (!naechste || vorgeladen === naechste) return;
  const s = song(naechste);
  if (!s) return;
  vorgeladen = naechste;
  if (!vorladeEl) { vorladeEl = new Audio(); vorladeEl.preload = 'auto'; }
  vorladeEl.src = s.pr;
  vorladeEl.load();
}

function stopAudio() {
  if (lastRenderedCard === null) return;     // schon gestoppt
  aud.pause(); aud.removeAttribute('src'); aud.load();
  lastRenderedCard = null;
  audioAnweisung = null;
}

function onAudioEnded() {
  setFortschritt(1);
  $('tlbl').textContent = '0:00';
  if (G && G.state.turn === seat && G.state.audio.playing)
    commit(s => { s.audio = { playing:false, startedAt:0, seek:0 }; return s; });
}

// Safari auf dem iPhone hält die Wiedergabe gelegentlich von sich aus an –
// am Rechner passiert das nicht. In der Veto-Phase fasst sonst nichts mehr
// das Audio-Element an (der Zustand ändert sich ja nicht), also käme der Ton
// nie zurück und der Song bräche genau dort ab, wo man ihn zum Abwägen
// bräuchte. Deshalb hier gegenprüfen und notfalls neu anstoßen.
//
// Bewusst ohne currentTime: nur weiterspielen, nie zurückspringen. Der
// laufende Abgleich auf die Sollposition ist genau das, was audioAnweisung
// vermeiden soll (siehe dort) – hier geht es allein um pausiert/läuft.
function weiterspielen() {
  if (!G || !G.state.audio?.playing || !aud.paused) return;
  const ph = G.state.phase;
  if (ph !== 'turn' && ph !== 'veto') return;
  if (lastRenderedCard === null) return syncAudio(G.state);  // Quelle abgeräumt
  if (!aud.duration) return;                                 // lädt noch
  const want = targetTime(G.state.audio);
  if (want < 0 || want >= aud.duration) return;              // Vorlauf bzw. durchgelaufen
  aud.play().catch(() => {});
}

// Fortschrittsbalken und Veto-Countdown lokal, ohne Netzwerk
tickTimer = setInterval(() => {
  vetoTick();
  weiterspielen();
  if (!aud.duration || aud.paused) return;
  setFortschritt(aud.currentTime / aud.duration);
  $('tlbl').textContent = fmtTime(aud.duration - aud.currentTime);
}, 250);

// Läuft das Fenster ab, lässt der erste Client durch, der es merkt. Der
// zweite findet die Phase schon verändert vor und sein commit verpufft.
// Wie viel des Fensters ist herum? 0 = gerade eröffnet, 1 = abgelaufen.
// Der Ring füllt sich entlang dieses Werts.
function vetoAnteil(st) {
  if (!st.vetoBis) return 0;
  const rest = Math.max(0, (st.vetoBis - serverNow()) / 1000);
  return Math.min(1, Math.max(0, 1 - rest / (VETO_MS / 1000)));
}

function vetoTick() {
  if (!G || G.state.phase !== 'veto' || !G.state.vetoBis) return;
  const rest = Math.max(0, (G.state.vetoBis - serverNow()) / 1000);
  const el = $('vetoZeit');
  if (el) el.textContent = Math.ceil(rest);
  const ring = $('vetoRing');
  if (ring) ring.setAttribute('stroke-dashoffset',
                              (VETO_U * (1 - vetoAnteil(G.state))).toFixed(2));
  const marke = (G.code || '') + ':' + G.state.vetoBis;
  if (rest <= 0 && vetoAblaufFuer !== marke) {
    vetoAblaufFuer = marke;
    durchlassen();
  }
}

// ══ Rendering ════════════════════════════════════════════════════
function render() {
  if (!G || !SONGS) return;
  const st = G.state;
  if (st.phase === 'lobby')      return renderLobby(st);
  if (st.phase === 'over')       return renderOver(st);
  renderGame(st);
}

function renderLobby(st) {
  show('lobbyScreen');
  $('lobbyCode').textContent = G.code;
  const seats = $('lobbySeats');
  seats.innerHTML = '';
  const dabei = aktive(st);
  SITZE.forEach((k, i) => {
    // Freie Plätze nur zeigen, solange noch jemand dazukommen kann.
    if (!st.seats[k] && i > dabei.length) return;
    const d = document.createElement('div');
    d.style.cssText = 'display:flex;align-items:center;gap:10px;width:100%;font-size:14px;font-weight:600';
    if (st.seats[k]) {
      d.innerHTML = `<span style="color:var(--green)">●</span> ${esc(st.seats[k].name)}` +
                    (k === seat ? ' <span style="color:var(--muted);font-weight:500">(du)</span>' : '');
    } else {
      d.innerHTML = `<span class="dot"></span> <span style="color:var(--muted);font-weight:500">warte auf Mitspieler…</span>`;
    }
    seats.appendChild(d);
  });
  const ready = dabei.length >= 2;
  const voll  = dabei.length >= SITZE.length;
  $('btnStart').disabled = !(ready && seat === 'p1');
  $('btnStart').textContent = seat === 'p1'
    ? (ready ? `Spiel starten (${dabei.length})` : 'Warte auf Mitspieler')
    : (ready ? 'Warte auf Start…' : 'Warte auf Mitspieler');
  $('lobbyHint').textContent = seat === 'p1'
    ? (voll ? 'Alle vier Plätze belegt' : 'Gib den Code an deine Mitspieler weiter')
    : 'Warte, bis gestartet wird';
}

function renderGame(st) {
  show('gameScreen');
  if (!$('btnRaus').classList.contains('frag')) rausZuruecksetzen();
  const mine = st.turn === seat;

  // ── Punktestand ──
  if (st.solo) {
    const herz = weg => `<svg class="${weg ? 'weg' : ''}" viewBox="0 0 95.2 100"><use href="#escherz"/></svg>`;
    const leben = Array.from({ length: st.maxFehler }, (_, i) => herz(i >= st.maxFehler - st.fehler)).join('');
    $('score').innerHTML = `
      <div class="seat active"><div class="nm">Karten</div>
        <div class="ct">${st.timelines.p1.length}</div></div>
      <div class="seat"><div class="nm">Leben</div>
        <div class="ct leben">${leben}</div></div>`;
  } else {
    const dabei = aktive(st);
    $('score').className = 'score' + (dabei.length > 2 ? ' viele' : '');
    $('score').innerHTML = dabei.map(k => {
      const v = st.vetos ? (st.vetos[k] || 0) : 0;
      const punkte = Array.from({ length: VETOS_START },
        (_, i) => `<span class="vpunkt${i >= v ? ' weg' : ''}"></span>`).join('');
      return `<div class="seat${st.turn===k?' active':''}">
        <div class="nm">${esc(st.seats[k]?.name || '—')}${k===seat?' (du)':''}</div>
        <div class="vzeile"><div class="ct">${st.timelines[k].length}<small> / ${st.ziel}</small></div>
          <span class="vlabel">Veto</span><span class="vpunkte">${punkte}</span></div>
      </div>`;
    }).join('');
  }

  $('hinweis').textContent = (!st.solo && st.hinweis) ? st.hinweis : '';

  // ── Bühne ──
  // Beim Ziehen und Anspielen leer: der Player allein sagt genug. In der
  // Veto-Phase übernimmt sie den Countdown, in der Auflösung die Karte.
  const stage = $('stage');
  const auflösung = st.phase === 'result';
  const vetoPhase = st.phase === 'veto';
  stage.innerHTML = auflösung ? revealHTML(st.result.id) : vetoPhase ? vetoHTML(st, mine) : '';
  stage.style.display = (auflösung || vetoPhase) ? 'block' : 'none';

  const vd = $('verdict');
  vd.textContent = auflösung ? verdictText(st, seat) : '';
  vd.className = 'verdict';

  // ── Player ──
  // Bleibt auch beim Ziehen stehen (nur ausgegraut), damit der Knopf nicht
  // erst auftaucht und alles darunter verschiebt.
  // Auch in der Veto-Phase: der Song trägt die Entscheidung, ob jemand
  // Einspruch erhebt. Der Player bleibt dabei ausgeblendet – die Bühne
  // gehört dem Countdown –, der Ton läuft aber unverändert weiter.
  const audible = st.phase === 'turn' || st.phase === 'veto';
  $('playerBox').style.display = (auflösung || vetoPhase) ? 'none' : 'flex';
  $('pbtn').disabled = !(audible && mine);
  if (audible) {
    const lauf = syncAudio(st);
    $('pbtn').classList.toggle('on', lauf === 'laeuft');
    setStat(
      lauf === 'laeuft' ? (st.solo ? 'Läuft' : 'Ihr hört beide zu')
      : lauf === 'vorlauf' ? 'Gleich geht’s los…'
      : lauf === 'laedt' ? 'Lädt…'
      : lauf === 'fertig' ? (mine ? 'Durchgelaufen – nochmal anhören oder einsortieren' : 'Durchgelaufen')
      : mine ? 'Tippe zum Anspielen'
      : 'Wartet auf ' + st.seats[st.turn].name,
      '');
  } else {
    $('pbtn').classList.remove('on');
    clearTimeout(vorlaufTimer);
    stopAudio();
    setFortschritt(0);
    $('tlbl').textContent = '—';
    setStat(st.phase === 'draw' && !mine ? 'Wartet auf ' + st.seats[st.turn].name : '', '');
    ladeNaechsteVor(st);        // Ziehen und Auflösen sind die ruhigen Momente
  }

  // ── Welche Zeitleiste ist zu sehen? ──
  // Beim Veto-Aussuchen die eigene, denn dorthin wandert die geklaute
  // Karte. In der Auflösung die, in der die Karte gelandet ist.
  const klauGelungen = auflösung && st.result.klau?.gelungen;
  const suchtVeto = vetoPhase && st.vetoAngemeldet === seat;
  // Beim Veto wird in der Leiste des Spielers am Zug getippt, nicht in der
  // eigenen. Nach gelungenem Klau zeigt die Auflösung die Leiste, in der
  // die Karte tatsächlich gelandet ist.
  const tlSeat = klauGelungen ? st.result.klau.seat
               : auflösung ? st.result.seat
               : st.turn;
  $('tlLabel').textContent = suchtVeto
      ? 'Wo gehört sie hin? Zeitleiste von ' + st.seats[st.turn].name
    : tlSeat === seat ? 'Deine Zeitleiste'
    : 'Zeitleiste von ' + st.seats[tlSeat].name;
  // Die eingeloggte Karte bleibt als offener Platzhalter sichtbar – auch
  // beim Aussuchen, damit man die angefochtene Stelle vor Augen hat. Die
  // Lückenindizes verschieben sich dadurch nicht.
  const platzhalter = (vetoPhase && st.pending && st.pending.seat === tlSeat)
    ? st.pending.index : -1;
  renderTimeline(st, tlSeat, (mine && st.phase === 'turn') || suchtVeto, platzhalter,
                 suchtVeto ? st.pending.index : -1);

  // ── Gegner kompakt (im Solo gibt es keinen) ──
  if (st.solo || tlSeat === seat) {
    $('oppo').innerHTML = '';
  } else {
    // Fremde Leiste im Hauptbereich – dann hier die eigenen Karten zeigen.
    const mein = st.timelines[seat] || [];
    $('oppo').innerHTML = `<div class="tllabel">Deine Karten</div>
      <div class="row">${mein.map(id => `<span class="chip">${song(id).year}</span>`).join('') ||
        '<span class="chip">noch leer</span>'}</div>`;
  }

  // ── Aktionen ──
  renderActions(st, mine);

  // Konfetti für den, der die Karte tatsächlich bekommen hat.
  if (auflösung) {
    const marke = st.result.id + ':' + st.result.index;
    const gewinner = klauGelungen ? st.result.klau.seat : (st.result.correct ? st.result.seat : null);
    if (gewinner && confettiShownFor !== marke) {
      confettiShownFor = marke;
      if (gewinner === seat) confetti();
    }
  }
}

function renderTimeline(st, tlSeat, interactive, platzhalter = -1, gesperrt = -1) {
  const tl = st.timelines[tlSeat];
  const el = $('tl');
  el.innerHTML = '';
  // Frisch einsortiert ist entweder die Karte des Spielers am Zug oder,
  // bei gelungenem Klau, die des Vetogebers.
  const r = st.phase === 'result' ? st.result : null;
  const freshIdx = !r ? -1
    : r.klau?.gelungen ? (r.klau.seat === tlSeat ? r.klau.zielIndex : -1)
    : (r.correct && r.seat === tlSeat ? r.index : -1);
  let focus = null;   // was der Spieler nach dem Neuzeichnen sehen muss

  for (let i = 0; i <= tl.length; i++) {
    // Die angefochtene Stelle selbst ist keine Wahl: dort liegt die Karte
    // laut Gegenspieler ja schon.
    const zu = i === gesperrt;
    const waehlbar = interactive && !zu;
    const gap = document.createElement('button');
    const sel = waehlbar && pendingGap === i;
    gap.className = 'gap' + (waehlbar ? ' live' : '') + (sel ? ' sel' : '') + (zu ? ' zu' : '');
    gap.innerHTML = '<span class="bar"></span>';
    if (waehlbar) {
      gap.addEventListener('click', () => {
        pendingGap = (pendingGap === i) ? null : i;
        render();
      });
    }
    el.appendChild(gap);
    if (sel) focus = gap;

    if (i === platzhalter) {
      const ph = document.createElement('div');
      ph.className = 'tlcard offen';
      ph.innerHTML = '<div class="fr">?</div>';
      el.appendChild(ph);
      focus = ph;
    }

    if (i < tl.length) {
      const s = song(tl[i]);
      const c = document.createElement('div');
      c.className = 'tlcard' + (i === freshIdx ? ' fresh' : '');
      c.style.background = verlauf(tl[i]);
      c.innerHTML = `<div class="f">${flagImg(s)}</div><div class="y">${s.year}</div><div class="t">${esc(s.title)}</div>`;
      el.appendChild(c);
      if (i === freshIdx) focus = c;
    }
  }
  if (!tl.length && !interactive) el.innerHTML = '<div class="tlempty">Noch keine Karten</div>';

  // Ab ~4 Karten passt die Leiste nicht mehr auf den Schirm. Die gewählte
  // Lücke bzw. die gerade einsortierte Karte muss aber sichtbar sein.
  if (focus) requestAnimationFrame(() =>
    focus.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' }));
}

function renderActions(st, mine) {
  const a = $('gameActions');
  a.innerHTML = '';
  const add = (label, cls, fn, disabled) => {
    const b = document.createElement('button');
    b.className = 'btn ' + cls;
    b.textContent = label;
    b.disabled = !!disabled;
    if (fn) b.addEventListener('click', fn);
    a.appendChild(b);
  };

  if (st.phase === 'draw') {
    mine ? add('Karte ziehen', 'prim', drawCard)
         : add('Warte auf ' + st.seats[st.turn].name + '…', '', null, true);
  } else if (st.phase === 'turn') {
    if (!mine) add(st.seats[st.turn].name + ' sortiert ein…', '', null, true);
    else if (pendingGap === null) add('Tippe eine Lücke in der Zeitleiste', '', null, true);
    else add('Karte einloggen', 'prim', () => { const g = pendingGap; pendingGap = null; einloggen(g); });
  } else if (st.phase === 'veto') {
    const habeVetos = (st.vetos?.[seat] || 0) > 0;
    if (mine) {
      add(st.vetoAngemeldet
            ? esc(st.seats[st.vetoAngemeldet]?.name || 'Jemand') + ' legt Veto ein…'
            : 'Kann angefochten werden…', '', null, true);
    } else if (st.vetoAngemeldet && st.vetoAngemeldet !== seat) {
      add(esc(st.seats[st.vetoAngemeldet]?.name || 'Jemand') + ' war schneller', '', null, true);
    } else if (st.vetoAngemeldet === seat) {
      if (pendingGap === null) add('Tippe die richtige Lücke', '', null, true);
      else add('Veto hier setzen', 'prim', () => { const g = pendingGap; pendingGap = null; vetoSetzen(g); });
      add('Doch nicht', '', vetoZurueck);
    } else if (habeVetos) {
      add('Veto', 'prim', vetoAnmelden);
      add('Durchlassen', '', durchlassen);
    } else {
      add('Keine Vetos mehr', '', null, true);
    }
  } else if (st.phase === 'result') {
    // Nach dem letzten Leben kommt keine Karte mehr – der Knopf führt zum
    // Ergebnis, und das soll er auch sagen.
    add(st.soloAus ? 'Ergebnis ansehen' : 'Nächste Karte', 'prim', naechsteKarte);
  }

}

// ── Kartenverläufe ───────────────────────────────────────────────
// Aus allen 336 gedruckten Karten ausgemessen: 25 Farbpaare, jeweils
// exakt linear über die Diagonale, teils in beide Richtungen.
const VERLAEUFE = [
  ['#FFF6AD','#FFA9F8'], ['#FFF199','#FF3131'], ['#99F074','#5DE6FE'],
  ['#FF49C6','#FFEA64'], ['#8B52FE','#5CE0E6'], ['#DDFE96','#51C84F'],
  ['#FFC1F4','#FF5D5D'], ['#CCFED8','#94B9FE'], ['#FFDF09','#FFFAC2'],
  ['#DBFEFE','#CBAFE7'], ['#0CC0DE','#FEDD59'], ['#5DE5FE','#FEC2F5'],
  ['#FFDE09','#FECFB4'], ['#0097B1','#7DD857'], ['#745BFE','#F85BF6'],
  ['#94B8FE','#F6A3F6'], ['#FE5757','#8C52FE'], ['#FE66B9','#59B4FF'],
  ['#5977FE','#FE71BE'], ['#FEBF31','#56EAE1'], ['#AE89F9','#00BE63'],
  ['#FF5757','#FFD852'], ['#ED4F4F','#745BFE'], ['#8B50FE','#A9FEA3'],
  ['#4D6CDB','#C1EFFE']
];

// Der Verlauf muss aus der Song-ID folgen, nicht aus Zufall: dieselbe
// Karte soll in der Zeitleiste, in der Auflösung und auf beiden Handys
// gleich aussehen. FNV-1a streut die 336 IDs gut über die 25 Paare.
function verlauf(id) {
  let h = 2166136261;
  const s = String(id);
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  h >>>= 0;
  const [a, b] = VERLAEUFE[h % VERLAEUFE.length];
  return (h >>> 9) & 1
    ? `linear-gradient(135deg,${b},${a})`
    : `linear-gradient(135deg,${a},${b})`;
}

// Dateiname der Herzflagge aus dem Ländernamen. Muss identisch zu slug()
// in build_flags.py bleiben.
function flagSlug(land) {
  return String(land).toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}

// Für Ungarn gibt es (noch) keine Herzflagge – dann übernimmt das Emoji.
// Der Ersatz muss ein Element sein, sonst greift das flex-gap daneben nicht.
function flagImg(s) {
  return `<img src="flags/${flagSlug(s.country)}.png" alt="" data-fb="${s.flag}"
               onerror="this.outerHTML='&lt;span&gt;'+this.dataset.fb+'&lt;/span&gt;'">`;
}

// ── Veto-Phase: Anzeige ──────────────────────────────────────────
function vetoHTML(st, mine) {
  const amZug = st.seats[st.turn].name;
  if (st.vetoAngemeldet) {
    const wer = st.vetoAngemeldet === seat;
    const name = st.seats[st.vetoAngemeldet]?.name || 'Jemand';
    return `<div class="vetobox scharf">
      <div class="vetoTitel">${wer ? 'Dein Veto läuft' : esc(name) + ' legt Veto ein!'}</div>
      <div class="vetoText">${wer
        ? 'Tippe unten in ' + esc(amZug) + 's Zeitleiste die Lücke, in die die Karte gehört. Liegst du richtig und ' + esc(amZug) + ' falsch, wandert sie zu dir.'
        : esc(name) + ' behauptet, die Platzierung sei falsch – und zeigt jetzt, wo die Karte hingehört.'}</div>
    </div>`;
  }
  // Weder Symbol noch Überschrift: der Ring sagt schon, dass die Zeit läuft,
  // und eine Zeile darunter, worum es geht. Alles weitere überfrachtet die
  // Box – sie steht nur fünfzehn Sekunden.
  //
  // Sekunden und Füllstand stehen schon im Markup, nicht erst nach dem
  // ersten Tick: sonst steht bis zu einer Viertelsekunde ein Platzhalter da
  // und der Ring springt sichtbar von leer auf seinen Stand.
  const sek = st.vetoBis
    ? Math.max(0, Math.ceil((st.vetoBis - serverNow()) / 1000))
    : null;
  return `<div class="vetobox">
    <div class="vetoRing">
      <svg viewBox="0 0 44 44" aria-hidden="true">
        <defs>
          <linearGradient id="vetoGrad" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
            <stop class="a" offset="0"/><stop class="m" offset=".55"/><stop class="b" offset="1"/>
          </linearGradient>
        </defs>
        <circle class="spur" cx="22" cy="22" r="${VETO_R}"/>
        <!-- rotate als SVG-Attribut, nicht per CSS-transform: transform-origin
             verhält sich auf SVG-Elementen je nach Browser unterschiedlich. -->
        <circle class="fuellung" id="vetoRing" cx="22" cy="22" r="${VETO_R}"
                transform="rotate(-90 22 22)"
                stroke-dasharray="${VETO_U.toFixed(2)}"
                stroke-dashoffset="${(VETO_U * (1 - vetoAnteil(st))).toFixed(2)}"/>
      </svg>
      <span class="vetoMitte">
        <span class="vetoZeit" id="vetoZeit">${sek ?? '–'}</span>
        <span class="vetoEinheit">Sek.</span>
      </span>
    </div>
    <div class="vetoText">${mine
      ? 'Wird dein Tipp angefochten?'
      : 'Liegt ' + esc(amZug) + ' mit dem Tipp richtig?'}</div>
  </div>`;
}

// ── Auflösung: Text ──────────────────────────────────────────────
function verdictText(st, ich) {
  const r = st.result;
  const k = r.klau;
  const amZug = st.seats?.[r.seat]?.name || '';
  if (k && k.gelungen) {
    const dieb = st.seats[k.seat].name;
    return k.seat === ich ? 'Veto! Du klaust die Karte' : dieb + ' klaut die Karte';
  }
  if (r.correct) {
    return k ? 'Richtig – das Veto verpufft' : 'Richtig einsortiert';
  }
  if (k) return 'Beide daneben – Karte verfällt';
  // Solo nach dem letzten Leben: zurück kommt hier nichts mehr.
  if (st.soloAus) return 'Daneben – das war dein letztes Leben';
  return 'Daneben – Karte kommt zurück';
}

function revealHTML(id) {
  const s = song(id);
  return `<div class="cardface" style="background:${verlauf(id)}">
    <div class="ca">${esc(s.artist)}</div>
    <div class="cy">${s.year}</div>
    <div class="ct">${esc(s.title)}</div>
    <div class="foot">
      <span class="land">${flagImg(s)}${esc(s.country)}</span>
      <span class="nr">${s.place && s.place !== '—' ? 'Platz ' + esc(s.place) : 'ESC'}</span>
    </div>
  </div>`;
}

function renderOver(st) {
  show('overScreen');
  stopAudio();
  localStorage.removeItem(SOLO_KEY);

  if (st.solo) {
    const n = st.timelines.p1.length;
    $('overTitle').textContent = soloRekord ? 'Neuer Bestwert!' : `${n} Karten`;
    $('overSub').textContent = soloRekord
      ? `${n} Karten in deiner Zeitleiste – so weit warst du noch nie.`
      : `${n} Karten geschafft. Dein Bestwert liegt bei ${bestwert()}.`;
    $('btnAgain').style.display = '';
    $('btnAgain').textContent = 'Nochmal solo';
    zeigeBestwert();
    if (soloRekord) confetti();
    return;
  }

  // Nur wer noch dabei ist: Ausgestiegene stünden sonst mit 0 Karten da,
  // was ihren tatsächlichen Stand vor dem Ausstieg verfälscht.
  const stand = aktive(st)
    .map(k => `${st.seats[k].name} ${st.timelines[k].length}`).join(' · ');

  // Abbruch: kein Sieger, keine Revanche – der andere ist ja weg.
  if (st.verlassen) {
    const ichWars = st.verlassen === seat;
    $('overTitle').textContent = ichWars ? 'Spiel verlassen'
      : esc(st.seats[st.verlassen]?.name || 'Dein Mitspieler') + ' ist ausgestiegen';
    $('overSub').textContent = 'Die Partie wurde abgebrochen. Stand war ' + stand + '.';
    $('btnAgain').style.display = 'none';
    return;
  }
  $('btnAgain').style.display = '';

  const w = st.winner;
  $('btnAgain').textContent = 'Nochmal spielen';
  $('overTitle').textContent = !w ? 'Unentschieden'
    : (w === seat ? 'Du gewinnst!' : (st.seats[w]?.name || 'Jemand') + ' gewinnt');
  $('overSub').textContent = stand;
  if (w === seat) confetti();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

// ── Konfetti (aus index.html übernommen) ─────────────────────────
function confetti() {
  const cols = ['#E0326E','#9E22B4','#4FBBDD','#D62E8A','#436EDC'];
  const c = $('cf');
  for (let i = 0; i < 36; i++) {
    const el = document.createElement('div');
    const sz=5+Math.random()*9, tx=(Math.random()-.5)*300, ty=-(80+Math.random()*220),
          rot=Math.random()*720, dl=Math.random()*.3;
    el.style.cssText = `position:absolute;width:${sz}px;height:${sz}px;background:${cols[i%5]};` +
      `border-radius:${Math.random()>.5?'50%':'2px'};left:${35+Math.random()*30}%;top:55%;` +
      `animation:cf${i} ${.8+Math.random()*.4}s ${dl}s ease-out forwards`;
    const st = document.createElement('style');
    st.textContent = `@keyframes cf${i}{to{transform:translate(${tx}px,${ty}px) rotate(${rot}deg);opacity:0}}`;
    document.head.appendChild(st); c.appendChild(el);
    setTimeout(() => { el.remove(); st.remove(); }, 1400);
  }
}
</script>
